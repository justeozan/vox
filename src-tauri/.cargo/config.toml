# `tauri dev` runs `cargo run`, which ad-hoc-signs the dev binary WITHOUT the
# microphone entitlement — so WKWebView's getUserMedia gets a silent mic stream
# and Vox never hears you. This runner re-signs the binary with the mic
# entitlement just before launch. See ../scripts/codesign-run.sh.
[target.aarch64-apple-darwin]
runner = "../scripts/codesign-run.sh"
