<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Vox</title>
<link rel="stylesheet" href="shared.css">
<style>
  html, body { width: 100%; height: 100%; }
  body {
    font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
    color: #fff;
    background: rgba(3, 3, 6, 0.94);
    user-select: none;
    -webkit-user-select: none;
    cursor: default;
    overflow: hidden;
  }
  .win { display: flex; height: 100%; }
  .side {
    width: 168px;
    flex: 0 0 auto;
    padding: 18px 12px 12px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    border-right: 1px solid rgba(255,255,255,0.09);
  }
  .tab {
    -webkit-appearance: none;
    appearance: none;
    text-align: left;
    padding: 8px 12px;
    border: 1px solid transparent;
    border-radius: 10px;
    background: transparent;
    color: rgba(255,255,255,0.55);
    font: inherit;
    font-size: 12.5px;
    cursor: pointer;
    transition: color 0.2s ease, background 0.2s ease, border-color 0.2s ease;
  }
  .tab:hover { color: rgba(255,255,255,0.85); }
  .tab.on {
    color: #d9ceff;
    background: rgba(167,139,250,0.14);
    border-color: rgba(167,139,250,0.3);
  }
  .side .reset-all-wrap { margin-top: auto; border-top: 1px solid rgba(255,255,255,0.07); }
  .content {
    flex: 1;
    min-width: 0;
    padding: 20px 26px;
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: rgba(255,255,255,0.12) transparent;
  }
  .pane { display: none; }
  .pane.on { display: block; animation: paneIn 0.25s var(--smooth) forwards; }
  @keyframes paneIn { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
<div class="win">
  <nav class="side">
      <button class="tab" data-tab="dictation" id="tab-dictation"></button>
      <button class="tab" data-tab="voice" id="tab-voice"></button>
      <button class="tab" data-tab="brain" id="tab-brain"></button>
      <button class="tab" data-tab="agents" id="tab-agents"></button>
      <button class="tab" data-tab="about" id="tab-about"></button>
        <div class="reset-all-wrap">
            <button class="reset-all" id="reset-all">Tout réinitialiser</button>
          </div>
  </nav>
  <main class="content" id="settings-body">
    <section class="pane" data-pane="dictation">
<div class="setting-group" id="grp-dictation">
        <div class="group-title" id="grp-dictation-title">Dictée</div>
        <div class="setting-warn" id="warn-acc" style="display:none">
          <span id="warn-acc-text"></span>
          <button class="update-btn" id="warn-acc-btn"></button>
          <button class="update-btn" id="warn-acc-open"></button>
        </div>
        <div class="setting-warn" id="warn-fn" style="display:none">
          <span id="warn-fn-text"></span>
          <button class="update-btn" id="warn-fn-btn"></button>
        </div>
        <div class="setting-row">
          <div class="setting-label-col">
            <div class="setting-label" id="lbl-dict-key">Touche</div>
            <div class="setting-hint" id="hint-dictation"></div>
          </div>
          <div class="row-ctl">
            <select id="dict-key-select" class="setting-select"></select>
            <button class="reset-btn" data-reset="dictation_key">↺</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label-col">
            <div class="setting-label" id="lbl-stt-model">Modèle de transcription</div>
            <div class="setting-hint" id="stt-progress" style="display:none"></div>
          </div>
          <div class="row-ctl">
            <select id="stt-model-select" class="setting-select"></select>
            <button class="reset-btn" data-reset="stt_model">↺</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-dict-cleanup">Nettoyage</div>
          <div class="row-ctl">
            <select id="dictation-format-select" class="setting-select"></select>
            <button class="reset-btn" data-reset="dictation_format">↺</button>
          </div>
        </div>
        <div class="setting-row vocab" id="row-vocab">
          <div class="vocab-head" id="vocab-head">
            <span class="vocab-chev" id="vocab-chev">▸</span>
            <span class="setting-label" id="lbl-vocab">Vocabulaire</span>
            <button class="reset-btn" id="vocab-reset">↺</button>
          </div>
          <div class="vocab-cols" id="vocab-cols" style="display:none">
            <div class="vocab-col">
              <div class="setting-hint" id="lbl-vocab-words">Mots</div>
              <textarea id="vocab-words" class="vocab-area" spellcheck="false" placeholder="Orivo&#10;Tauri"></textarea>
            </div>
            <div class="vocab-col">
              <div class="setting-hint" id="lbl-vocab-repl">Remplacements</div>
              <textarea id="vocab-repl" class="vocab-area" spellcheck="false" placeholder="from => to"></textarea>
            </div>
          </div>
        </div>
      </div>
    </section>
    <section class="pane" data-pane="voice">
      <div class="setting-group">
        <div class="group-title" id="grp-voice-title">Voix</div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-lang">Langue</div>
          <div class="row-ctl">
            <div class="segment" id="lang-segment">
              <button data-lang="fr">FR</button>
              <button data-lang="en">EN</button>
            </div>
            <button class="reset-btn" data-reset="language">↺</button>
          </div>
        </div>
        <div class="setting-row" id="row-tts-engine" style="display:none">
          <div class="setting-label" id="lbl-tts-engine">Voix</div>
          <div class="row-ctl">
            <select id="tts-engine-select" class="setting-select"></select>
            <button class="reset-btn" data-reset="tts_engine">↺</button>
          </div>
        </div>
      </div>
    </section>
    <section class="pane" data-pane="brain">
      <div class="setting-group">
        <div class="group-title" id="grp-brain-title">Cerveau</div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-provider">IA</div>
          <div class="row-ctl" style="flex:1;min-width:0;justify-content:flex-end">
            <div class="setting-pair">
              <select id="provider-select" class="setting-select"></select>
              <select id="model-select" class="setting-select"></select>
            </div>
            <button class="reset-btn" data-reset="provider,model">↺</button>
          </div>
        </div>
      </div>
    </section>
    <section class="pane" data-pane="agents">
      <div class="setting-group">
        <div class="group-title" id="grp-agents-title">Agents</div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-agent-reply">Réponse d'agent</div>
          <div class="row-ctl">
            <div class="segment" id="agent-reply-segment">
              <button data-reply="summary">RÉSUMÉ</button>
              <button data-reply="verbatim">MOT POUR MOT</button>
            </div>
            <button class="reset-btn" data-reset="agent_reply">↺</button>
          </div>
        </div>
        <div class="setting-row" id="hermes-row" style="display:none">
          <div class="setting-label" id="lbl-hermes">Hermes</div>
          <div class="row-ctl">
            <div class="segment" id="hermes-segment">
              <button data-hermes="on">ON</button>
              <button data-hermes="off">OFF</button>
            </div>
            <button class="reset-btn" data-reset="hermes_voice">↺</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-backend">Backend</div>
          <div class="row-ctl">
            <div class="segment" id="backend-segment">
              <button data-backend="orca">ORCA</button>
              <button data-backend="conductor">CONDUCTOR</button>
            </div>
            <button class="reset-btn" data-reset="backend">↺</button>
          </div>
        </div>
      </div>
    </section>
    <section class="pane" data-pane="about">
      <div class="setting-group">
        <div class="group-title" id="grp-app-title">Application</div>
        <div class="setting-row">
          <div class="setting-label"><span id="lbl-glass">Transparence</span><span class="setting-tag" id="glass-tag" style="display:none">Liquid Glass</span></div>
          <div class="row-ctl">
            <div class="range-wrap">
              <input type="range" id="glass-range" min="0" max="100" step="5" value="40">
              <div class="setting-value range-value" id="glass-value">40 %</div>
            </div>
            <button class="reset-btn" data-reset="glass_transparency">↺</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-drop">Goutte</div>
          <div class="row-ctl">
            <div class="segment" id="drop-segment">
              <button data-drop="60">1 MIN</button>
              <button data-drop="180">3 MIN</button>
              <button data-drop="600">10 MIN</button>
              <button data-drop="0">JAMAIS</button>
            </div>
            <button class="reset-btn" data-reset="drop_after_secs">↺</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label-col">
            <div class="setting-label" id="lbl-licence">Licence Evey</div>
            <div class="setting-hint" id="licence-hint"></div>
          </div>
          <div class="licence-ctl">
            <input id="licence-key" class="setting-input" placeholder="sub_…" autocomplete="off" spellcheck="false">
            <button class="update-btn" id="licence-btn">Activer</button>
          </div>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-version">Version</div>
          <div class="setting-value" id="app-version">—</div>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-update">Mises à jour</div>
          <button class="update-btn" id="update-btn">Vérifier</button>
        </div>
        <div class="setting-row">
          <div class="setting-label" id="lbl-setup">Installation</div>
          <button class="update-btn" id="setup-repair-btn">Vérifier</button>
        </div>
      </div>
    </section>
  </main>
</div>

<script src="shared.js"></script>
<script>
let uiLang = 'fr'
let probe = null
const TABS = ['dictation', 'voice', 'brain', 'agents', 'about']
const TAB_LABEL = { dictation: 'grpDict', voice: 'grpVoice', brain: 'grpBrain', agents: 'grpAgents', about: 'grpAbout' }

// ── Evey licence (optional) ──
;(function () {
  const input = document.getElementById('licence-key')
  const btn = document.getElementById('licence-btn')
  const hint = document.getElementById('licence-hint')
  const fr = () => { try { return uiLang !== 'en' } catch { return true } }
  const T = {
    label: ['Licence Evey', 'Evey licence'],
    activate: ['Activer', 'Activate'], remove: ['Retirer', 'Remove'],
    none: ['Optionnelle — Vox fonctionne sans.', 'Optional — Vox works without it.'],
    valid: ['Active ✓', 'Active ✓'],
    invalid: ['Clé non validée (hors ligne ?)', 'Key not validated (offline?)'],
    inactive: ['Abonnement terminé', 'Subscription ended'],
  }
  const t = k => T[k][fr() ? 0 : 1]
  let state = 'none'
  function apply(st) {
    state = (st && st.state) || 'none'
    document.getElementById('lbl-licence').textContent = t('label')
    const has = state !== 'none'
    input.style.display = has ? 'none' : ''
    btn.textContent = has ? t('remove') : t('activate')
    hint.textContent = t(state in T ? state : 'none')
    hint.classList.toggle('ok', state === 'valid')
    hint.classList.toggle('err', state === 'inactive' || state === 'invalid')
  }
  btn.addEventListener('click', async () => {
    btn.disabled = true
    try {
      if (state !== 'none') apply(await invoke('licence_clear'))
      else { apply(await invoke('licence_activate', { key: input.value })); input.value = '' }
    } catch (e) {
      try { apply(await invoke('licence_status')) } catch {}
      hint.textContent = String(e); hint.classList.add('err'); hint.classList.remove('ok')
    }
    btn.disabled = false
  })
  input.addEventListener('keydown', e => { if (e.key === 'Enter') btn.click() })
  listen('licence-changed', ev => apply(ev.payload))
  window.refreshLicenceI18n = () => invoke('licence_status').then(apply).catch(() => {})
  window.refreshLicenceI18n()
})()


const modelSelect = document.getElementById('model-select')
const langSegment = document.getElementById('lang-segment')
const agentReplySegment = document.getElementById('agent-reply-segment')
const backendSegment = document.getElementById('backend-segment')
const hermesRow = document.getElementById('hermes-row')
const hermesSegment = document.getElementById('hermes-segment')
const dropSegment = document.getElementById('drop-segment')
const glassRange = document.getElementById('glass-range')
const glassValue = document.getElementById('glass-value')
const glassTag = document.getElementById('glass-tag')
const providerSelect = document.getElementById('provider-select')
const PROVIDERS = ['ollama', 'claude-cli', 'codex-cli', 'anthropic', 'openai']
const PROVIDER_LABEL = {
  'ollama': 'provOllama', 'claude-cli': 'provClaudeCli', 'codex-cli': 'provCodexCli',
  'anthropic': 'provAnthropic', 'openai': 'provOpenai',
}
let providerStatus = {}

function renderProviderOptions(current) {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  providerSelect.innerHTML = ''
  for (const p of PROVIDERS) {
    const st = providerStatus[p] || { ok: true, detail: '' }
    const o = document.createElement('option')
    o.value = p
    // Say WHY it can't be used rather than hiding it — the fix (set a key,
    // install a CLI) is one action the user can take.
    o.textContent = L[PROVIDER_LABEL[p]] + (st.ok ? '' : ' — ' + st.detail)
    o.disabled = !st.ok && p !== current
    providerSelect.appendChild(o)
  }
  providerSelect.value = current || 'ollama'
}

const dictFormatSelect = document.getElementById('dictation-format-select')
const vocabWordsEl = document.getElementById('vocab-words')
const vocabReplEl = document.getElementById('vocab-repl')
const engineSelect = document.getElementById('tts-engine-select')
const engineRow = document.getElementById('row-tts-engine')
const ENGINE_KEYS = ['auto', 'kokoro', 'piper', 'qwen3', 'say']
const ENGINE_LABEL = { auto: 'engAuto', kokoro: 'engKokoro', piper: 'engPiper',
                       qwen3: 'engQwen', say: 'engSay' }
let engineRowVisible = false

const dictKeySelect = document.getElementById('dict-key-select')
const sttSelect = document.getElementById('stt-model-select')
const sttProgress = document.getElementById('stt-progress')
const DICT_KEYS = ['fn', 'right_option', 'right_command', 'right_shift', 'alt_shift_space']
let sttModels = []          // [{id,label,detail,installed}]
let sttInstalling = null    // model id while install_stt runs

function setText(id, txt) { const el = document.getElementById(id); if (el) el.textContent = txt }

function renderSttOptions() {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  const cur = sttSelect.value || curSettings.stt_model || 'whisper-small'
  sttSelect.innerHTML = ''
  const list = sttModels.length ? sttModels : [{ id: cur, label: cur, installed: true }]
  for (const m of list) {
    const o = document.createElement('option')
    o.value = m.id
    o.textContent = (m.label || m.id) + (m.installed ? '' : ' · ' + L.toInstall)
    if (m.detail) o.title = m.detail
    sttSelect.appendChild(o)
  }
  if (!list.some(m => m.id === cur)) {
    const o = document.createElement('option'); o.value = cur; o.textContent = cur
    sttSelect.appendChild(o)
  }
  sttSelect.value = cur
}

function renderDictationI18n() {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setText('grp-dictation-title', L.grpDict)
  setText('grp-voice-title', L.grpVoice)
  setText('grp-brain-title', L.grpBrain)
  setText('grp-agents-title', L.grpAgents)
  setText('grp-app-title', L.grpApp)
  if (window.refreshLicenceI18n) window.refreshLicenceI18n()
  setText('lbl-dict-key', L.dictKey)
  setText('lbl-stt-model', L.sttModel)
  setText('lbl-dict-cleanup', L.dictCleanup)
  setText('lbl-vocab', L.vocab)
  setText('hint-dictation', L.dictHint)
  setText('lbl-vocab-words', L.vocabWords)
  setText('lbl-vocab-repl', L.vocabRepl)
  setText('reset-all', L.resetAll)
  setText('warn-acc-text', L.accWarn); setText('warn-acc-btn', L.accBtn); setText('warn-acc-open', L.accOpen)
  setText('warn-fn-text', L.fnWarn); setText('warn-fn-btn', L.fnBtn)
  for (const b of document.querySelectorAll('.reset-btn')) b.title = L.resetTip
  const ck = dictKeySelect.value || curSettings.dictation_key || 'fn'
  dictKeySelect.innerHTML = ''
  for (const k of DICT_KEYS) {
    const o = document.createElement('option')
    o.value = k; o.textContent = (L.dictKeys && L.dictKeys[k]) || k
    dictKeySelect.appendChild(o)
  }
  dictKeySelect.value = ck
  const cur = dictFormatSelect.value || 'llm'
  dictFormatSelect.innerHTML = ''
  for (const [v, k] of [['llm', 'dictLlm'], ['raw', 'dictRaw']]) {
    const o = document.createElement('option')
    o.value = v; o.textContent = L[k]
    dictFormatSelect.appendChild(o)
  }
  dictFormatSelect.value = cur
  renderSttOptions()
}

function renderEngineOptions() {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  const cur = engineSelect.value
  engineSelect.innerHTML = ''
  for (const k of ENGINE_KEYS) {
    const o = document.createElement('option')
    o.value = k
    o.textContent = L[ENGINE_LABEL[k]]
    engineSelect.appendChild(o)
  }
  engineSelect.value = cur || 'auto'
}

// t: 0..100, 100 = most transparent. Only the CSS tint moves; the native glass
// behind is untouched.
function applyTransparency(t) {
  const v = Math.min(100, Math.max(0, Number(t)))
  const a = (0.62 * (1 - v / 100)).toFixed(3)
  document.documentElement.style.setProperty('--tint-a', a)
}

function renderGlassValue(t) {
  glassRange.value = t
  glassRange.style.setProperty('--fill', t + '%')
  glassValue.textContent = t + ' %'
}

// Apply the settings the renderer itself acts on (Init + each settings open).
function applyVisualSettings(s) {
  const t = Number.isFinite(s.glass_transparency) ? s.glass_transparency : 40
  applyTransparency(t)
  renderGlassValue(t)
  const secs = Number.isFinite(s.drop_after_secs) ? s.drop_after_secs : 180
  for (const b of dropSegment.querySelectorAll('button')) {
    b.classList.toggle('on', Number(b.dataset.drop) === secs)
  }
}

function applyUiLang() {
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  document.title = labels.winTitle
  for (const t of TABS) setText('tab-' + t, labels[TAB_LABEL[t]])
  document.getElementById('lbl-lang').textContent = labels.lang
  document.getElementById('lbl-version').textContent = labels.version
  document.getElementById('lbl-update').textContent = labels.update
  document.getElementById('lbl-agent-reply').textContent = labels.agentReply
  document.getElementById('lbl-provider').textContent = labels.provider
  document.getElementById('lbl-backend').textContent = labels.backend
  document.getElementById('lbl-hermes').textContent = labels.hermes
  hermesSegment.title = labels.hermesHint
  backendSegment.title = labels.backendHint
  document.getElementById('lbl-glass').textContent = labels.glass
  document.getElementById('lbl-drop').textContent = labels.drop
  const neverBtn = dropSegment.querySelector('button[data-drop="0"]')
  if (neverBtn) neverBtn.textContent = labels.dropNever
  document.getElementById('lbl-tts-engine').textContent = labels.ttsEngine
  renderEngineOptions()
  renderDictationI18n()
  for (const b of agentReplySegment.querySelectorAll('button')) {
    b.textContent = b.dataset.reply === 'summary' ? labels.replySummary : labels.replyVerbatim
  }
  renderUpdateBtn()
  setText('setup-repair-btn', labels.check)
  setText('lbl-setup', labels.repair)
}

// Update button reflects updateInfo: null → "Check", up-to-date, or "Download".
let updateInfo = null
const updateBtn = document.getElementById('update-btn')

function renderUpdateBtn() {
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  updateBtn.disabled = false
  updateBtn.classList.remove('ok')
  if (!updateInfo) {
    updateBtn.textContent = labels.check
  } else if (updateInfo.checking) {
    updateBtn.textContent = labels.checking
    updateBtn.disabled = true
  } else if (updateInfo.hasUpdate) {
    updateBtn.textContent = labels.download + ' ' + updateInfo.latest
  } else {
    updateBtn.textContent = labels.upToDate
    updateBtn.classList.add('ok')
  }
}

updateBtn.addEventListener('click', async () => {
  if (updateInfo && updateInfo.hasUpdate && updateInfo.url) {
    invoke('open_url', { url: updateInfo.url })
    return
  }
  updateInfo = { checking: true }
  renderUpdateBtn()
  try {
    updateInfo = await invoke('check_update')
  } catch {
    updateInfo = null
  }
  renderUpdateBtn()
})

// Current vs default settings drive the per-row reset buttons (↺).
let curSettings = {}
let defaultSettings = {}

function refreshResets() {
  for (const btn of document.querySelectorAll('.reset-btn[data-reset]')) {
    const keys = btn.dataset.reset.split(',')
    const differs = keys.some(k =>
      defaultSettings[k] !== undefined && curSettings[k] !== undefined && curSettings[k] !== defaultSettings[k])
    btn.classList.toggle('show', differs)
  }
}

// Persist a patch, keep the local copy in sync with what the backend says it
// stored, and refresh the reset buttons. Returns the stored settings (or null).
async function saveSettings(patch) {
  Object.assign(curSettings, patch)
  let next = null
  try {
    next = await invoke('set_settings', { next: patch })
    if (next && typeof next === 'object') Object.assign(curSettings, next)
  } catch (err) {
    console.warn('[vox] set_settings failed:', err)
  }
  refreshResets()
  return next
}

// Accessibility / Fn-key warnings at the top of the Dictée group. Re-checked
// each time the panel opens, when the key changes and when the window regains
// focus (the user just came back from System Settings).
let accPoll = null
async function refreshDictStatus() {
  const accEl = document.getElementById('warn-acc')
  const fnEl = document.getElementById('warn-fn')
  let accOk = true, fnOk = true
  try { accOk = (await invoke('accessibility_status')) !== false }
  catch (err) { console.warn('[vox] accessibility_status failed:', err) }
  if ((curSettings.dictation_key || 'fn') === 'fn') {
    try {
      const st = await invoke('fn_key_status')
      fnOk = !(st && st.globe_does_nothing === false)
    } catch (err) { console.warn('[vox] fn_key_status failed:', err) }
  }
  accEl.style.display = accOk ? 'none' : ''
  // Light re-check every 2 s while the warning is up, so it clears by itself
  // once the grant lands (no need to reopen the window).
  clearTimeout(accPoll)
  if (!accOk) accPoll = setTimeout(refreshDictStatus, 2000)
  fnEl.style.display = fnOk ? 'none' : ''
}
window.addEventListener('focus', () => refreshDictStatus())
document.getElementById('warn-acc-btn').addEventListener('click', async () => {
  try { await invoke('request_accessibility') } catch (err) { console.warn('[vox] request_accessibility failed:', err) }
  refreshDictStatus()
})
document.getElementById('warn-acc-open').addEventListener('click', () => {
  invoke('open_url', { url: 'x-apple.systempreferences:com.apple.preference.security?Privacy_Accessibility' })
    .catch((err) => console.warn('[vox] open_url failed:', err))
})
document.getElementById('warn-fn-btn').addEventListener('click', () => {
  invoke('open_url', { url: 'x-apple.systempreferences:com.apple.Keyboard-Settings.extension' })
    .catch((err) => console.warn('[vox] open_url failed:', err))
})

// Push `curSettings` into every control (also used after a reset).
async function fillControls() {
  const s = curSettings
  uiLang = s.language || 'fr'
  dictKeySelect.value = s.dictation_key || 'fn'
  dictFormatSelect.value = s.dictation_format || 'llm'
  sttSelect.value = s.stt_model || 'whisper-small'
  applyUiLang()
  renderProviderOptions(s.provider || 'ollama')
  await reloadModels(s.provider || 'ollama', s.model)
  for (const btn of langSegment.querySelectorAll('button')) {
    btn.classList.toggle('on', btn.dataset.lang === uiLang)
  }
  for (const btn of agentReplySegment.querySelectorAll('button')) {
    btn.classList.toggle('on', btn.dataset.reply === (s.agent_reply || 'summary'))
  }
  for (const btn of backendSegment.querySelectorAll('button')) {
    btn.classList.toggle('on', btn.dataset.backend === (s.backend || 'orca'))
  }
  // Only offered when Hermes is actually on this machine.
  invoke('hermes_info').then((h) => {
    hermesRow.style.display = h && h.installed ? '' : 'none'
  }).catch(() => { hermesRow.style.display = 'none' })
  for (const btn of hermesSegment.querySelectorAll('button')) {
    btn.classList.toggle('on', (btn.dataset.hermes === 'on') === (s.hermes_voice !== false))
  }
  applyVisualSettings(s)
  if (engineRowVisible) engineSelect.value = s.tts_engine || 'auto'
  refreshResets()
}

providerSelect.addEventListener('change', async () => {
  const next = await saveSettings({ provider: providerSelect.value })
  // The backend resets `model` to that provider's default, because model ids
  // don't transfer — reload the list and show what it actually picked.
  const st = next || curSettings
  await reloadModels(st.provider || providerSelect.value, st.model)
})

async function reloadModels(provider, model) {
  const models = await invoke('list_models', { provider }).catch(() => [])
  modelSelect.innerHTML = ''
  for (const name of models) {
    const o = document.createElement('option')
    o.value = name; o.textContent = name
    modelSelect.appendChild(o)
  }
  if (model && !models.includes(model)) {
    const o = document.createElement('option')
    o.value = model; o.textContent = model
    modelSelect.appendChild(o)
  }
  modelSelect.value = model || (models[0] || '')
}

// Vocabulary: one word per line / `from => to` per line. A failing command only
// logs — the panel stays usable.
async function loadVocabulary() {
  try {
    const v = await invoke('get_vocabulary')
    vocabWordsEl.value = (v.words || []).join('\n')
    vocabReplEl.value = (v.replacements || []).map(r => r.from + ' => ' + r.to).join('\n')
    refreshVocabReset()
  } catch (err) {
    console.warn('[vox] get_vocabulary failed:', err)
  }
}

function saveVocabulary() {
  const words = vocabWordsEl.value.split('\n').map(l => l.trim()).filter(Boolean)
  const replacements = []
  for (const line of vocabReplEl.value.split('\n')) {
    const i = line.indexOf('=>')
    if (i < 0) continue
    const from = line.slice(0, i).trim(), to = line.slice(i + 2).trim()
    if (from) replacements.push({ from, to })
  }
  invoke('set_vocabulary', { vocab: { words, replacements } })
    .catch((err) => console.warn('[vox] set_vocabulary failed:', err))
}
document.getElementById('vocab-head').addEventListener('click', (e) => {
  if (e.target.closest('.reset-btn')) return
  const row = document.getElementById('row-vocab')
  const open = row.classList.toggle('open')
  document.getElementById('vocab-cols').style.display = open ? '' : 'none'
})
document.getElementById('vocab-reset').addEventListener('click', () => {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  if (!confirm(L.vocabResetConfirm)) return
  vocabWordsEl.value = ''; vocabReplEl.value = ''
  saveVocabulary()
  refreshVocabReset()
})
function refreshVocabReset() {
  const has = vocabWordsEl.value.trim() || vocabReplEl.value.trim()
  document.getElementById('vocab-reset').classList.toggle('show', !!has)
}
vocabWordsEl.addEventListener('input', refreshVocabReset)
vocabReplEl.addEventListener('input', refreshVocabReset)
vocabWordsEl.addEventListener('change', saveVocabulary)
vocabReplEl.addEventListener('change', saveVocabulary)
vocabWordsEl.addEventListener('blur', saveVocabulary)
vocabReplEl.addEventListener('blur', saveVocabulary)

dictFormatSelect.addEventListener('change', () => {
  saveSettings({ dictation_format: dictFormatSelect.value })
})

modelSelect.addEventListener('change', () => {
  saveSettings({ model: modelSelect.value })
})

dictKeySelect.addEventListener('change', async () => {
  await saveSettings({ dictation_key: dictKeySelect.value })
  refreshDictStatus()
})

// Choosing a model that isn't installed installs it first (progress comes from
// setup-log events tagged "stt"), and only then saves the setting. On failure
// the select goes back to the previous model and the error is shown.
function setSttProgress(text, cls) {
  sttProgress.style.display = text ? '' : 'none'
  sttProgress.className = 'setting-hint' + (cls ? ' ' + cls : '')
  sttProgress.textContent = text || ''
}
sttSelect.addEventListener('change', async () => {
  const id = sttSelect.value
  const prev = curSettings.stt_model || 'whisper-small'
  const m = sttModels.find(x => x.id === id)
  if (!m || m.installed) {
    setSttProgress('')
    saveSettings({ stt_model: id })
    return
  }
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  sttInstalling = id
  sttSelect.disabled = true
  setSttProgress(L.installing, 'busy')
  try {
    await invoke('install_stt', { model: id })
    m.installed = true
    sttInstalling = null
    setSttProgress('')
    renderSttOptions()
    sttSelect.value = id
    await saveSettings({ stt_model: id })
  } catch (err) {
    console.warn('[vox] install_stt failed:', err)
    sttInstalling = null
    sttSelect.value = prev
    setSttProgress(String((err && err.message) || err), 'err')
  }
  sttSelect.disabled = false
})

// Restarts the TTS daemon and speaks a fixed sample line — the A/B in one click.
engineSelect.addEventListener('change', () => {
  saveSettings({ tts_engine: engineSelect.value })
})

// No daemon restart here, unlike the language toggle: the announcement path
// reads this per turn.
agentReplySegment.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-reply]')
  if (!btn) return
  for (const b of agentReplySegment.querySelectorAll('button')) b.classList.toggle('on', b === btn)
  saveSettings({ agent_reply: btn.dataset.reply })
})

hermesSegment.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-hermes]')
  if (!btn) return
  for (const b of hermesSegment.querySelectorAll('button')) b.classList.toggle('on', b === btn)
  saveSettings({ hermes_voice: btn.dataset.hermes === 'on' })
})

// No restart: every workspace lookup re-reads it, so the next turn (and the
// next watcher tick) already uses the new backend.
backendSegment.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-backend]')
  if (!btn) return
  for (const b of backendSegment.querySelectorAll('button')) b.classList.toggle('on', b === btn)
  saveSettings({ backend: btn.dataset.backend })
})

// Live preview while dragging; persisted once the thumb settles.
let glassSaveTimer = null
glassRange.addEventListener('input', () => {
  const n = Number(glassRange.value)
  applyTransparency(n)
  renderGlassValue(n)
  clearTimeout(glassSaveTimer)
  glassSaveTimer = setTimeout(() => {
    saveSettings({ glass_transparency: n })
  }, 150)
})

dropSegment.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-drop]')
  if (!btn) return
  for (const b of dropSegment.querySelectorAll('button')) b.classList.toggle('on', b === btn)
  const secs = Number(btn.dataset.drop)
  saveSettings({ drop_after_secs: secs })
})

langSegment.addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-lang]')
  if (!btn) return
  for (const b of langSegment.querySelectorAll('button')) b.classList.toggle('on', b === btn)
  uiLang = btn.dataset.lang
  applyUiLang()
  saveSettings({ language: btn.dataset.lang })
})

// Per-row reset: write the default(s) for the row's key(s), then redraw.
for (const btn of document.querySelectorAll('.reset-btn[data-reset]')) {
  btn.addEventListener('click', async (e) => {
    e.stopPropagation()
    const patch = {}
    for (const k of btn.dataset.reset.split(',')) {
      if (defaultSettings[k] !== undefined) patch[k] = defaultSettings[k]
    }
    if (!Object.keys(patch).length) return
    const next = await saveSettings(patch)
    if (!next) Object.assign(curSettings, patch)
    await fillControls()
    if (patch.dictation_key !== undefined) refreshDictStatus()
  })
}

document.getElementById('reset-all').addEventListener('click', async () => {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  if (!confirm(L.resetAllConfirm)) return
  if (Object.keys(defaultSettings).length) {
    await saveSettings({ ...defaultSettings })
    await fillControls()
  }
  vocabWordsEl.value = ''; vocabReplEl.value = ''
  saveVocabulary()
  refreshVocabReset()
  refreshDictStatus()
})


// ── Tabs ─────────────────────────────────────────────────────────────────────
function showTab(name) {
  for (const b of document.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.tab === name)
  for (const p of document.querySelectorAll('.pane')) p.classList.toggle('on', p.dataset.pane === name)
  document.getElementById('settings-body').scrollTop = 0
}
for (const b of document.querySelectorAll('.tab')) b.addEventListener('click', () => showTab(b.dataset.tab))

// Esc closes the window (⌘W is the native Close menu item).
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !e.target.closest?.('textarea, input')) {
    window.__TAURI__.window.getCurrentWindow().close()
  }
})

// "Re-run setup" lives on the pill: hand over to it.
document.getElementById('setup-repair-btn').addEventListener('click', () => {
  invoke('rerun_setup').catch((err) => console.warn('[vox] rerun_setup failed:', err))
})

listen('setup-log', (e) => {
  if (sttInstalling && e.payload.tag === 'stt' && e.payload.line) {
    setSttProgress(String(e.payload.line).trim().slice(0, 90), 'busy')
  }
})

async function init() {
  curSettings = await invoke('get_settings')
  uiLang = curSettings.language || 'fr'
  applyUiLang()
  applyVisualSettings(curSettings)
  invoke('glass_info').then((g) => {
    glassTag.style.display = g && g.liquid_glass ? '' : 'none'
  }).catch(() => { glassTag.style.display = 'none' })
  invoke('get_version').then((v) => { setText('app-version', 'v' + v) }).catch(() => {})
  invoke('settings_defaults').then((d) => { defaultSettings = d || {}; refreshResets() })
    .catch((err) => console.warn('[vox] settings_defaults failed:', err))
  invoke('stt_models').then((m) => { sttModels = Array.isArray(m) ? m : []; renderSttOptions() })
    .catch((err) => console.warn('[vox] stt_models failed:', err))
  // Provider first: it decides which model list is even meaningful.
  providerStatus = await invoke('provider_status').catch(() => ({}))
  // Only offer the voice-engine picker once there is something to pick.
  probe = await invoke('probe_setup').catch(() => null)
  engineRowVisible = !!(probe && probe.qwenReady)
  engineRow.style.display = engineRowVisible ? '' : 'none'
  await fillControls()
  refreshDictStatus()
  loadVocabulary()
}

showTab('dictation')
init()
</script>
</body>
