<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="shared.css">
<style>

  :root {
    /* One curve for every size change and reveal, so the pill's growth, the
       panel fade and the bar's hover glide read as a single gesture. Gentle
       start, long soft landing (Apple-style). */
    --pill-ease: cubic-bezier(0.32, 0.72, 0, 1);
    /* Pill size + the duration of the change in flight. syncWindow() rewrites
       these on .shell; the same numbers go to Rust (set_pill_frame) so the
       native blur tracks the CSS exactly. 0ms until first paint is done. */
    --pill-w: 240px;
    --pill-h: 40px;
    --pill-dur: 0ms;
    /* Pill tint alpha. applyTransparency() rewrites it from the Transparency
       setting; the native Liquid Glass / blur behind does the rest. */
  }

  /* The window is a fixed transparent envelope; only .shell paints. */
  html, body { width: 100%; height: 100%; background: transparent; }

  body {
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
    color: #fff;
    cursor: default;
  }

  /* ── Shell — the pill. The REAL blur is the native NSVisualEffectView
       behind this window, rounded at the same 28px radius and resized by Rust
       in lockstep with this element, so the CSS layer only tints and outlines.
       The window itself never resizes: the pill is bottom-centred in a fixed
       envelope and animates its OWN width/height, so it grows upward from the
       bar. Margin (not translateX) centres it — transform belongs to the
       pillIn/pillReturn keyframes. */
  .shell {
    /* Panels sit at their FINAL height (--panel-h, from the target pill size,
       not the animating one) and the shell clips them from the top while it
       grows or shrinks — a sheet sliding behind the pill's top edge. With
       flex-end, any overflow spills out the TOP, so the bar is pinned to the
       bottom at every frame; with the default start alignment a panel's
       padding pushed the bar ~20px down near the end of a shrink, and it
       snapped back up when the panel was hidden. */
    --panel-w: calc(var(--pill-w) - 2px);   /* minus border */
    --panel-h: calc(var(--pill-h) - 42px);  /* minus bar 40 + border 2 */
    justify-content: flex-end;
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    margin: 0 auto;
    width: var(--pill-w);
    height: var(--pill-h);
    display: flex;
    flex-direction: column;
    /* Translucent enough that the native blur reads through — with the
       vibrancy view now correctly BELOW the webview, the pill stays dark
       and premium without killing the real-time blur. */
    background: rgba(3, 3, 6, var(--tint-a));
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 28px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
    transition: border-color 0.35s ease, box-shadow 0.35s ease,
                background-color 0.45s var(--pill-ease),
                border-radius var(--pill-dur) var(--pill-ease),
                width var(--pill-dur) var(--pill-ease),
                height var(--pill-dur) var(--pill-ease);
  }

  /* ── Drop — idle "water drop". After a few minutes unused the pill morphs
       into a small round glass bead (48px, bottom-centred where it was). Only
       .shell's own width/height/radius animate — never a transform — so the
       native glass follows. 999px clamps to a perfect capsule at every size, so
       the radius transition can't glitch on the way. */
  body.dropped .shell {
    border-radius: 999px;
    background: rgba(3, 3, 6, calc(var(--tint-a) * 0.55));
    border-color: rgba(255,255,255,0.24);
    box-shadow: inset 0 1px 1px rgba(255,255,255,0.35), inset 0 -3px 8px rgba(255,255,255,0.08);
  }
  /* Specular highlight: a layer above the glass, invisible in the normal pill. */
  .shell::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    background:
      radial-gradient(120% 120% at 30% 20%, rgba(255,255,255,0.28) 0%, rgba(255,255,255,0.07) 30%, transparent 55%),
      radial-gradient(80% 80% at 72% 88%, rgba(255,255,255,0.12), transparent 60%);
    transition: opacity 0.4s var(--pill-ease), filter 0.26s var(--pill-ease);
  }
  body.dropped .shell::after { opacity: 1; }
  body.dropped.hovered .shell::after { filter: brightness(1.55); }

  /* Three tiny bars that breathe — the drop's only content. They land as the
     shrink finishes and vanish fast on wake. */
  .drop-glyph {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 3px;
    pointer-events: none;
    z-index: 2;
    opacity: 0;
    transform: scale(0.6);
    transition: opacity 120ms var(--pill-ease), transform 120ms var(--pill-ease);
  }
  .drop-glyph span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.88);
    transition: background 0.3s;
  }
  .drop-glyph span:nth-child(1), .drop-glyph span:nth-child(3) { height: 7px; }
  .drop-glyph span:nth-child(2) { height: 13px; }
  body.dropped .drop-glyph {
    opacity: 1;
    transform: scale(1);
    transition: opacity 260ms var(--pill-ease) 340ms, transform 380ms var(--pill-ease) 340ms;
  }
  body.dropped .drop-glyph span { animation: dropBreathe 2.8s ease-in-out infinite; }
  body.dropped .drop-glyph span:nth-child(2) { animation-delay: 0.35s; }
  body.dropped .drop-glyph span:nth-child(3) { animation-delay: 0.7s; }
  body.dropped.running .drop-glyph span { background: var(--violet); }
  @keyframes dropBreathe {
    0%, 100% { transform: scaleY(0.7); }
    50%      { transform: scaleY(1.15); }
  }

  /* Glows are INSET so they follow the pill's rounded corners. An outer
     box-shadow would bleed past the pill and get clipped to the window's
     rectangle — the "square corners" behind the violet/blue layers. */
  body.boot      .shell { border-color: rgba(196,181,253,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 26px rgba(196,181,253,0.42); }
  /* Unprompted speech. Violet like the agent family, but no pulse and a much
     softer glow than boot — it announces, it doesn't demand. */
  body.announcing .shell { border-color: rgba(167,139,250,0.38); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 16px rgba(167,139,250,0.20); }
  body.active    .shell { border-color: rgba(74,222,128,0.32); }
  body.listening .shell { border-color: rgba(74,222,128,0.6);  animation: shellPulseGreen 2.2s ease-in-out infinite; }
  body.thinking  .shell, body.dictation-processing .shell { border-color: rgba(245,158,11,0.5); }
  /* Dictation (typing mode): rose, the one hue the assistant states don't use. */
  body.dictating .shell { border-color: rgba(244,114,182,0.6); animation: shellPulseRose 2.2s ease-in-out infinite; }
  body.speaking  .shell { border-color: rgba(96,165,250,0.55); animation: shellPulseBlue 2.6s ease-in-out infinite; }
  body.running   .shell { border-color: rgba(167,139,250,0.4); }

  @keyframes shellPulseGreen {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 14px rgba(74,222,128,0.14); }
    50%      { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 28px rgba(74,222,128,0.34); }
  }
  @keyframes shellPulseRose {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 14px rgba(244,114,182,0.14); }
    50%      { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 28px rgba(244,114,182,0.32); }
  }
  @keyframes shellPulseBlue {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 14px rgba(96,165,250,0.12); }
    50%      { box-shadow: inset 0 1px 0 rgba(96,165,250,0.30), inset 0 0 28px rgba(96,165,250,0.30); }
  }

  /* ── Entrance ───────────────────────────────────────────────────────────
     Only at first show, where WE control the timing (Rust holds the window
     hidden for 400ms, so this really does start from nothing). */
  body.appearing .shell { animation: pillIn 0.42s var(--spring) both; }
  @keyframes pillIn {
    from { opacity: 0; transform: translateY(10px) scale(0.965); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Return ─────────────────────────────────────────────────────────────
     For coming back into view after a Space switch. Deliberately NOT an
     entrance: we only learn about it after the compositor has already drawn
     the pill, so anything starting from opacity 0 flashes — it appears, blinks
     out, then fades back in. This starts from the visible state instead and
     just draws the eye: a glint crosses, and the rim lights briefly. */
  body.returning .shell { animation: pillReturn 0.55s var(--smooth); }
  @keyframes pillReturn {
    0%   { border-color: rgba(255,255,255,0.09); }
    35%  { border-color: rgba(255,255,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 0 22px rgba(255,255,255,0.10); }
    100% { border-color: rgba(255,255,255,0.09); }
  }
  body.returning .boot-sweep { animation: bootSweep 0.55s var(--smooth) 1; }

  /* ── Boot sweep — violet sheen crossing once when the recap begins */
  .boot-sweep {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
    background: linear-gradient(100deg,
      transparent 15%,
      rgba(196,181,253,0.05) 35%,
      rgba(196,181,253,0.30) 50%,
      rgba(196,181,253,0.05) 65%,
      transparent 85%);
    transform: translateX(-110%);
  }
  body.boot .boot-sweep { animation: bootSweep 1.1s var(--smooth) 2; }
  body.announcing .boot-sweep { animation: bootSweep 0.9s var(--smooth) 1; }
  @keyframes bootSweep {
    0%   { opacity: 0; transform: translateX(-110%); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(110%); }
  }

  /* ── Worktree carousel — vertical, scrolls to the worktree being spoken ── */
  .carousel {
    display: none;
    flex-direction: column;
    gap: 7px;
    padding: 14px 16px 34px 16px;   /* bottom: room for .panel-actions */
    flex: 0 0 auto;
    align-self: center;
    width: var(--panel-w);
    height: var(--panel-h);
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 8px), transparent 100%);
  }
  .carousel::-webkit-scrollbar { display: none; }
  body.carousel-open .carousel {
    display: flex;
    animation: settingsIn 0.3s var(--smooth) forwards;
  }

  /* Closing phase: the body class is already gone but the panel stays up while
     it fades and the pill shrinks around it, otherwise the content vanishes
     before the shell has moved. JS adds .closing and removes it when the shrink
     ends. Declared after the open rules; the "wins over" rules below still
     beat it (higher specificity), so a panel can't linger beside its
     replacement. */
  .carousel.closing, .setup.closing {
    display: flex;
    pointer-events: none;
    animation: panelOut 0.16s var(--pill-ease) forwards;
  }
  @keyframes panelOut { from { opacity: 1; } to { opacity: 0; } }

  .ws-card {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 13px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 13px;
    background: rgba(0,0,0,0.22);
    opacity: 0.5;
    transform: scale(0.98);
    transition: opacity 0.35s ease, transform 0.35s var(--spring),
                border-color 0.35s ease, background 0.35s ease;
  }
  .ws-card.speaking {
    opacity: 1;
    transform: scale(1);
    border-color: rgba(167,139,250,0.45);
    background: rgba(167,139,250,0.09);
  }
  .ws-status { width: 7px; height: 7px; border-radius: 50%; background: #5a5a64; flex-shrink: 0; }
  .ws-card[data-status="working"] .ws-status { background: var(--amber); box-shadow: 0 0 6px rgba(245,158,11,0.5); }
  .ws-card[data-status="idle"] .ws-status    { background: var(--green); }
  .ws-card[data-status="error"] .ws-status   { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }
  .ws-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .ws-meta {
    font-size: 10.5px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .ws-unread {
    font-size: 9.5px;
    font-weight: 700;
    background: rgba(167,139,250,0.2);
    border: 1px solid rgba(167,139,250,0.4);
    color: #c9b8fd;
    padding: 1px 7px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  /* ── Bar row — always pinned at the bottom of the pill ─────────────────── */
  .bar {
    position: relative;
    height: 40px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 10px;
    margin-top: auto;
    /* Follows the TARGET width like the panels do (shell clips it), so the
       row never reflows while the pill animates. */
    width: calc(var(--pill-w) - 2px);
    flex: 0 0 auto;
    align-self: center;
  }
  /* Dropped: pinned at the full pill width so the 48px bead merely clips it. */
  body.dropped .bar { width: 238px; opacity: 0; pointer-events: none; }

  /* ── Dot + listening ripple rings ──────────────────────────────────────── */
  .dot-wrap { position: relative; width: 8px; height: 8px; flex-shrink: 0; }
  .dot {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #5a5a64;
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s var(--spring);
  }
  .ring {
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1.5px solid var(--green);
    opacity: 0;
    pointer-events: none;
  }
  body.active .dot    { background: var(--green);  box-shadow: 0 0 6px rgba(74,222,128,0.4); }
  body.listening .dot { background: var(--green);  box-shadow: 0 0 12px rgba(74,222,128,0.7); transform: scale(1.15); }
  body.dictating .dot { background: #f472b6; box-shadow: 0 0 12px rgba(244,114,182,0.7); transform: scale(1.15); }
  body.thinking .dot, body.dictation-processing .dot { background: var(--amber);  box-shadow: 0 0 9px rgba(245,158,11,0.6); animation: dotThink 1s ease-in-out infinite; }
  body.speaking .dot  { background: var(--blue);   box-shadow: 0 0 9px rgba(96,165,250,0.6); }
  body.running .dot   { background: var(--violet); box-shadow: 0 0 9px rgba(167,139,250,0.6); }
  body.boot .dot      { background: var(--boot);   box-shadow: 0 0 16px rgba(196,181,253,0.95); animation: bootDot 1s var(--spring); }
  body.announcing .dot { background: var(--violet); box-shadow: 0 0 12px rgba(167,139,250,0.75); animation: bootDot 0.7s var(--spring); }

  body.dictating .ring { border-color: #f472b6; }
  body.dictating .ring.r1 { animation: ripple 1.8s ease-out infinite; }
  body.listening .ring.r1 { animation: ripple 1.6s ease-out infinite; }
  body.listening .ring.r2 { animation: ripple 1.6s ease-out 0.55s infinite; }
  body.speaking .ring.r1  { border-color: var(--blue); animation: ripple 2s ease-out infinite; }

  @keyframes ripple {
    0%   { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0;   transform: scale(3.6); }
  }
  @keyframes dotThink {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(0.72); }
  }
  @keyframes bootDot {
    0%   { transform: scale(0.3); opacity: 0.2; }
    45%  { transform: scale(1.8); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ── Waveform ──────────────────────────────────────────────────────────── */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 1;
    height: 30px;
    min-width: 0;
    transition: opacity 0.3s ease;
  }
  .waveform span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
    height: 4px;
  }
  body.active .waveform span    { background: rgba(74,222,128,0.30); }
  body.listening .waveform span { background: rgba(74,222,128,0.75); }
  body.thinking .waveform span, body.dictation-processing .waveform span { background: rgba(245,158,11,0.5); }
  body.dictating .waveform span { background: rgba(244,114,182,0.75); }
  body.speaking .waveform span  { background: rgba(96,165,250,0.7); }
  body.running .waveform span   { background: rgba(167,139,250,0.4); }
  body.boot .waveform span      { background: rgba(196,181,253,0.9); }
  body.announcing .waveform span { background: rgba(167,139,250,0.75); }
  body.has-transcript .waveform { opacity: 0.25; }

  /* ── Transcript overlay — per-letter reveal ────────────────────────────── */
  .transcript {
    position: absolute;
    left: 38px;
    right: 150px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12.5px;
    /* Fixed, so enlarging the spoken word can't grow the line box and shift
       the whole transcript vertically. */
    line-height: 20px;
    font-weight: 500;
    color: rgba(255,255,255,0.95);
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.35s ease;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .transcript.visible { opacity: 1; }
  /* The text rides on its own track so a line longer than the pill can slide
     right-to-left and be read through, instead of being clipped mid-word. */
  .transcript .track {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
  }
  .transcript .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(4px) scale(0.9);
    animation: chIn 0.3s var(--smooth) forwards;
  }
  .transcript .ch.sp { width: 0.28em; }
  /* Delegation echo — the exact prompt Vox sent an agent. Violet, because it is
     Vox reporting an action rather than speaking to you. */
  .transcript.deleg { color: #d6c9ff; }
  /* Karaoke: the word being said is white and enlarged, everything else is
     grey at normal size. `scale` is a transform, not a font-size change, so
     the surrounding words never reflow — the line keeps its measured width and
     the follow-the-voice scroll stays exact. */
  .transcript .w {
    display: inline-block;
    transform-origin: 50% 50%;
    transition: color 0.12s ease, transform 0.14s var(--smooth),
                margin 0.14s var(--smooth);
  }
  /* Only dim once a word-by-word pass is actually running: without audio to
     follow (your own transcript) the line stays fully legible. */
  .transcript.karaoke .w { color: rgba(255,255,255,0.42); }
  /* Zoom with `transform`, make room with a per-word margin computed in JS.
     Neither alone works: `font-size` reserves the right space but reflows the
     line VERTICALLY (the whole transcript bobs as the highlight moves), while
     `scale()` leaves the vertical alone but reserves nothing — and its overlap
     is proportional to word length, so no fixed em margin can serve both a
     3-letter and a 10-letter word. So: transform for the look (zero vertical
     effect), and a margin measured from each word's own width for the room.
     See KARAOKE_ZOOM in the script. */
  .transcript.karaoke .w.spoken {
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  @keyframes chIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  .transcript .caret {
    display: inline-block;
    width: 2px;
    height: 13px;
    margin-left: 3px;
    vertical-align: -2px;
    background: currentColor;
    opacity: 0.7;
    animation: caretBlink 1s steps(2, start) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* ── Label ─────────────────────────────────────────────────────────────── */
  .label {
    font-size: 11px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.42);
    flex-shrink: 0;
    min-width: 84px;
    text-align: right;
    transition: color 0.3s;
  }
  /* No text (idle / agents running): take no room, so the waveform and the
     badge get the space instead of an invisible 84px box. */
  .label:empty { display: none; }
  body.active .label    { color: rgba(74,222,128,0.6); }
  body.listening .label { color: rgba(74,222,128,0.9); }
  body.dictating .label { color: rgba(244,114,182,0.95); }
  body.thinking .label, body.dictation-processing .label { color: rgba(245,158,11,0.7); background: linear-gradient(90deg, rgba(245,158,11,0.5), #ffd188, rgba(245,158,11,0.5)); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.6s linear infinite; }
  body.speaking .label  { color: rgba(96,165,250,0.8); }
  body.running .label   { color: rgba(167,139,250,0.9); }
  body.boot .label      { color: rgba(196,181,253,0.95); }
  body.announcing .label { color: rgba(167,139,250,0.95); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ── Agent badge ───────────────────────────────────────────────────────── */
  .badge {
    display: none;
    background: rgba(167,139,250,0.16);
    border: 1px solid rgba(167,139,250,0.35);
    color: #c3b1fc;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 10px;
    letter-spacing: 0.06em;
    flex-shrink: 0;
    animation: badgePop 0.4s var(--spring);
    align-items: center;
    gap: 4px;
    line-height: 14px;
  }
  .badge svg { width: 12px; height: 12px; display: block; flex-shrink: 0; }
  /* "An agent is working": the antenna pulses like a status light and the eyes
     scan side to side. Lives on the icon so the waveform can stay still. */
  .badge svg .ag-ant, .badge svg .ag-eyes { transform-box: fill-box; transform-origin: center; }
  .badge svg .ag-ant  { animation: agAntenna 1.3s ease-in-out infinite; }
  .badge svg .ag-eyes { animation: agEyes 2.4s ease-in-out infinite; }
  @keyframes agAntenna {
    0%, 100% { opacity: 0.35; transform: scale(0.8); }
    50%      { opacity: 1;    transform: scale(1.5); }
  }
  @keyframes agEyes {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-1.1px); }
    75%      { transform: translateX(1.1px); }
  }
  @media (prefers-reduced-motion: reduce) {
    .badge svg .ag-ant, .badge svg .ag-eyes { animation: none; }
  }
  @keyframes badgePop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  /* Outline-only: quieter than the filled agent badge sitting next to it. */
  .badge.announce {
    background: transparent;
    border-color: rgba(167,139,250,0.55);
    color: #c9b8fd;
    cursor: pointer;
  }

  /* ── Panel actions — recap + settings, bottom-right of the open panel ───
     Not in the bar any more: they live with the project overview, just above
     the agent badge, and only exist while the carousel or settings is open. */
  .panel-actions {
    position: absolute;
    right: 14px;
    bottom: 46px;               /* bar 40 + border 2 + 4 */
    z-index: 3;
    display: none;
    gap: 6px;
    align-items: center;
  }
  body.carousel-open .panel-actions {
    display: flex;
    animation: settingsIn 0.3s var(--smooth) forwards;
  }
  /* Idle hover: the recap button appears inside the bar, nothing before. */
  body.hovered.idle:not(.carousel-open):not(.setup-open):not(.dropped) .panel-actions,
  body.hovered.running:not(.carousel-open):not(.setup-open):not(.dropped) .panel-actions {
    display: flex;
    bottom: 7px;
    right: 8px;
    animation: settingsIn 0.3s var(--smooth) forwards;
  }
  @keyframes settingsIn { from { opacity: 0; } to { opacity: 1; } }
  body.setup-open .panel-actions { display: none; }
  .panel-btn {
    width: 26px;
    height: 26px;
    padding: 0;
    display: grid;
    place-items: center;
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 50%;
    background: rgba(0,0,0,0.28);
    color: rgba(255,255,255,0.55);
    cursor: pointer;
    transition: color 0.25s ease, background 0.25s ease, transform 0.35s var(--spring);
  }
  .panel-btn:hover { color: #d9ceff; background: rgba(167,139,250,0.14); transform: scale(1.08); }
  .panel-btn:active { transform: scale(0.94); }
  .panel-btn svg { display: block; width: 15px; height: 15px; }

  /* Hover: everything breathes a little wider. */
  .bar > * { transition: transform 0.3s var(--smooth); }
  /* Waking: content returns late (after the pill has grown) and gently. */
  .bar { transition: gap 0.3s var(--pill-ease), opacity 260ms var(--pill-ease) 180ms; }
  body.hovered .bar { gap: 13px; }
  /* Dropping: content is gone almost at once, no delay. */
  body.dropped .bar { transition: gap 0.3s var(--pill-ease), opacity 140ms var(--pill-ease); }

  @media (prefers-reduced-motion: reduce) {
    .bar, .panel-btn { transition-duration: 0.01ms; }
    body .bar, body.dropped .bar, .shell::after, body.dropped .drop-glyph, .drop-glyph {
      transition-duration: 0.01ms; transition-delay: 0s;
    }
    body.dropped .drop-glyph span { animation: none; }
    .carousel.closing, .setup.closing,
    body.carousel-open .carousel, body.setup-open .setup {
      animation-duration: 0.01ms;
    }
  }

  /* ── Setup panel (first-run auto-install) ───────────────────────────────
     Bottom-anchored like settings; setup wins over settings + carousel. */
  .setup {
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px 22px 4px 22px;
    flex: 0 0 auto;
    align-self: center;
    width: var(--panel-w);
    height: var(--panel-h);

  .setup-header {

  .setup-status.busy { color: rgba(167,139,250,0.8); }
  .setup-status.ok   { color: rgba(74,222,128,0.85); }

  .setup-chip.miss .sdot { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }

</style>

<body>
<div class="shell" data-tauri-drag-region>
  <div class="boot-sweep"></div>
  <div class="drop-glyph" aria-hidden="true"><span></span><span></span><span></span></div>

  <div class="carousel" id="carousel"></div>

  <div class="setup" id="setup">
    <div class="setup-header">
      <div class="setup-title" id="setup-title">installation</div>
      <div class="setup-status" id="setup-status">—</div>
    </div>

    <div class="setup-actions">
      <button class="update-btn" id="qwen-btn">Qwen3-TTS (test)</button>

    </div>
  </div>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 12a9 9 0 1 0 2.83-6.54"/>
        <polyline points="3 3 3 8 8 8"/>
        <path d="M12 7v5l3.5 2"/>
      </svg>
    </button>
  </div>
</div>

<script src="shared.js"></script>
<script>
// ── Tauri bridge ──────────────────────────────────────────────────────────────
const { convertFileSrc } = window.__TAURI__.core


// ── VAD config ────────────────────────────────────────────────────────────────
const SPEECH_THRESHOLD   = 0.015
const SILENCE_THRESHOLD  = 0.009
const SILENCE_MS         = 800
const SPEECH_ONSET_MS    = 80
const BARGE_IN_THRESHOLD = 0.030
const MIN_SPEECH_SAMPLES = 8000
const AMBIENT_ALPHA      = 0.002
const SPEECH_SNR         = 2.2

// ── Pill geometry ────────────────────────────────────────────────────────────
// The native window is a fixed transparent envelope; these are the sizes of the
// CSS pill drawn inside it (see syncWindow). Hover never changes the size: the
// hover stretch was the most-noticed motion in the UI for the least
// information — nothing about the pill's meaning changes when the cursor
// arrives.
const SIZE_BASE     = [240, 40]
const SIZE_SETUP    = [520, 470]

// CSS animates the pill's own width/height; Rust animates the native blur to
// match, so both get the SAME duration, set per change: slightly longer growing
// (the sheet needs room to reveal) than shrinking.
const GROW_MS = 420
const SHRINK_MS = 340
const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)')
const shellEl = document.querySelector('.shell')
let lastPill = null  // [w, h] last applied; null until the first (unanimated) call

// Idle drop: the pill becomes a small glass bead after dropAfterMs unused.
const DROP_SIZE = 48
const DROP_HOVER_SIZE = 54
const DROP_MS = 620        // morph into the drop
const WAKE_MS = 480        // back to the pill
const DROP_HOVER_MS = 260  // swell on hover
let dropped = false
let dropAfterMs = 180000   // settings drop_after_secs * 1000; 0 = never
let dropTimer = null

// ── State machine ─────────────────────────────────────────────────────────────
let state = 'idle'
let agentCount = 0
let agentLabels = []
let pendingAnnouncements = 0
let appearing = false
let returning = false
let carouselOpen = false
let carouselCloseTimer = null
let hovered = false
let uiLang = 'fr'
let setupOpen = false
let setupRunning = false
let setupInitiated = false


const COMP_LABELS = {
  fr: { python: 'Python', ffmpeg: 'ffmpeg', espeakNg: 'espeak-ng', ollama: 'Ollama',
        venv: 'venv', whisper: 'Whisper', kokoro: 'Kokoro', piper: 'Piper',
        piperVoice: 'Voix Piper', qwen3: 'Qwen3-TTS', qwen3Model: 'Modèle Qwen3' },
  en: { python: 'Python', ffmpeg: 'ffmpeg', espeakNg: 'espeak-ng', ollama: 'Ollama',
        venv: 'venv', whisper: 'Whisper', kokoro: 'Kokoro', piper: 'Piper',
        piperVoice: 'Piper voice', qwen3: 'Qwen3-TTS', qwen3Model: 'Qwen3 model' },
}

const labelEl = document.getElementById('label')
let lastLabel = ''

function setLabel(text) {
  if (text === lastLabel) return
  lastLabel = text
  // Crossfade + slide via WAAPI
  labelEl.animate(
    [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-7px)' }],
    { duration: 110, easing: 'ease-in', fill: 'forwards' }
  ).onfinish = () => {
    labelEl.textContent = text
    labelEl.animate(
      [{ opacity: 0, transform: 'translateY(7px)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
    )
  }
}

// Panels stay up (as .closing) while they fade and the pill shrinks, then hide.
// Reopening, or any other panel opening, cancels this at once.
const panelEls = {
  carousel: document.getElementById('carousel'),
  setup: document.getElementById('setup'),
}
const panelWasOpen = { carousel: false, setup: false }
let panelCloseTimer = null

function endPanelClose() {
  clearTimeout(panelCloseTimer)
  panelCloseTimer = null
  for (const el of Object.values(panelEls)) {
    el.classList.remove('closing')
    el.style.width = ''
    el.style.height = ''
  }
}

function updatePanels() {
  const open = { carousel: carouselOpen, setup: setupOpen }
  const anyOpen = open.carousel || open.setup
  if (anyOpen) {
    // A panel replacing another must not share the pill with its fading twin.
    endPanelClose()
  } else {
    let closed = false
    for (const k in panelEls) {
      if (!panelWasOpen[k]) continue
      // Freeze the panel at its open size BEFORE --pill-w/h drop to the bar
      // size (its own height would otherwise collapse to 0 at once): the
      // shrinking shell then clips it from the top, like a sheet tucking away.
      const el = panelEls[k]
      el.style.width = el.offsetWidth + 'px'
      el.style.height = el.offsetHeight + 'px'
      el.classList.add('closing')
      closed = true
    }
    if (closed) {
      clearTimeout(panelCloseTimer)
      // Fallback for transitionend (which won't fire if the size doesn't change).
      panelCloseTimer = setTimeout(endPanelClose, (reducedMotion.matches ? 0 : SHRINK_MS) + 50)
    }
  }
  Object.assign(panelWasOpen, open)
}

// The shell's height transition ending is the real "shrink finished" signal.
document.querySelector('.shell').addEventListener('transitionend', (e) => {
  if (e.target === e.currentTarget && e.propertyName === 'height') endPanelClose()
})

function bodyClasses() {
  updatePanels()
  document.body.className = state
    + (dropped ? ' dropped' : '')
    + (setupOpen ? ' setup-open' : '')
    + (carouselOpen ? ' carousel-open' : '')
    + (hovered ? ' hovered' : '')
    + (transcriptEl.classList.contains('visible') ? ' has-transcript' : '')
    + (appearing ? ' appearing' : '')
    + (returning ? ' returning' : '')
}

// Mirrored to the backend on every transition. The mic lives entirely in the
// webview, so this is Rust's ONLY view of whether Vox may speak unprompted.
// Keep in sync with the UI_* constants in lib.rs.
const UI_CODES = {
  idle: 0, active: 1, listening: 2, thinking: 3,
  speaking: 4, running: 5, boot: 6, announcing: 7,
  // Dictation has no code of its own on the Rust side: report it as a busy
  // turn so Vox never speaks unprompted over the user's typing.
  dictating: 2, 'dictation-processing': 3,
}

function setState(s) {
  if (s !== state) lastSpeechSignal = Date.now()
  state = s
  syncDuck(s)
  noteActivity()
  if (dropped && s !== 'idle' && s !== 'running') wake()
  invoke('ui_state', { code: UI_CODES[s] ?? 0 }).catch(() => {})
  bodyClasses()
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setLabel(labels[s] || '')
  updateBadge()
  animateWaveform(s)
}

// Outline robot head, same stroke language as the recap icon.
const AGENT_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<rect x="4" y="8" width="16" height="12" rx="3.5"/>'
  + '<path d="M12 8V4.5"/><circle class="ag-ant" cx="12" cy="3.5" r="1"/>'
  + '<g class="ag-eyes"><path d="M9 13.5v1.2M15 13.5v1.2"/></g></svg>'

// Speaker with sound waves: "something is waiting to be said". Same stroke
// language as AGENT_ICON, so the two counters read as different things at a
// glance instead of two bare numbers side by side.
const ANNOUNCE_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'
  + '<path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z"/>'
  + '<path d="M15.5 9.2a4 4 0 0 1 0 5.6"/><path d="M18.2 6.8a7.6 7.6 0 0 1 0 10.4"/></svg>'

function updateBadge() {
  const badge = document.getElementById('badge')
  // "N <icon>" — compact enough to sit in the bar without crowding the
  // transcript gutter. Which repos/worktrees they are lives in the tooltip.
  badge.innerHTML = agentCount + AGENT_ICON
  badge.title = agentLabels.join(', ')
  badge.style.display = (agentCount > 0 && state !== 'idle') ? 'inline-flex' : 'none'
  updateAnnounceBadge()
}

function updateAnnounceBadge() {
  const b = document.getElementById('announce-badge')
  b.innerHTML = pendingAnnouncements + ANNOUNCE_ICON
  b.title = pendingAnnouncements
    ? (uiLang === 'en' ? 'Click to hear what\'s waiting' : 'Clique pour entendre ce qui attend')
    : ''
  // Hidden while actually announcing — the pill itself is the signal then.
  b.style.display = (pendingAnnouncements > 0 && state !== 'announcing') ? 'inline-flex' : 'none'
}

// ── Waveform ──────────────────────────────────────────────────────────────────
const waveEl = document.getElementById('waveform')
const BAR_COUNT = 18
for (let i = 0; i < BAR_COUNT; i++) waveEl.appendChild(document.createElement('span'))
const bars = waveEl.querySelectorAll('span')

// ── Live levels ───────────────────────────────────────────────────────────────
// The bars show the REAL signal: microphone while you talk, the clip's own
// loudness while Vox talks. Each bar is one recent level sample, newest on the
// right, so the row scrolls like an oscilloscope of the last ~0.8s.
const levelHist = new Float32Array(BAR_COUNT)
let levelSmooth = 0, levelLastPush = 0
const LEVEL_STEP_MS = 45
const LEVEL_FULL_SCALE = 0.15   // RMS that fills a bar (speech sits ~0.03–0.15)

// TTS clips are played through an <audio> element (so echo cancellation can
// serve barge-in); routing that through WebAudio would change that path. So we
// decode each clip separately and keep a 20 ms RMS envelope to read at
// currentTime. Fetch is CORS-allowed by Tauri's asset protocol for our origin.
const envCtx = new OfflineAudioContext(1, 1, 16000)
const ENV_HOP_S = 0.02
async function loadEnvelope(src) {
  const raw = await (await fetch(src)).arrayBuffer()
  const decoded = await envCtx.decodeAudioData(raw)
  const ch = decoded.getChannelData(0)
  const hop = Math.max(1, Math.round(decoded.sampleRate * ENV_HOP_S))
  const frames = new Float32Array(Math.ceil(ch.length / hop))
  for (let f = 0; f < frames.length; f++) {
    let sum = 0
    const end = Math.min(ch.length, (f + 1) * hop)
    for (let i = f * hop; i < end; i++) sum += ch[i] * ch[i]
    frames[f] = Math.sqrt(sum / Math.max(1, end - f * hop))
  }
  return frames
}

function outputLevel(audio) {
  const frames = audio._env
  if (!frames || audio.paused) return null
  const f = Math.floor(audio.currentTime / ENV_HOP_S)
  // Peak of a ~60 ms window so consonants don't vanish between frames.
  let v = 0
  for (let k = f - 1; k <= f + 1; k++) if (frames[k] > v) v = frames[k]
  return v
}

// Returns the current real level, or null when there is none to show (the
// caller then falls back to the synthetic animation for that state).
function liveLevel(s) {
  if ((s === 'active' || s === 'listening') && analyser) return getRMS()
  if ((s === 'speaking' || s === 'announcing' || s === 'boot') && currentAudio) {
    return outputLevel(currentAudio)
  }
  return null
}

let rafId
function animateWaveform(s) {
  cancelAnimationFrame(rafId)
  levelHist.fill(0)
  levelSmooth = 0

  function tick() {
    const t = Date.now()
    const live = liveLevel(s)
    if (live !== null) {
      // Fast attack, slower release: reads as voice, not as jitter.
      levelSmooth = live > levelSmooth
        ? levelSmooth * 0.35 + live * 0.65
        : levelSmooth * 0.8 + live * 0.2
      if (t - levelLastPush >= LEVEL_STEP_MS) {
        levelLastPush = t
        levelHist.copyWithin(0, 1)
        levelHist[BAR_COUNT - 1] = levelSmooth < 0.003 ? 0 : levelSmooth
      }
    }
    bars.forEach((b, i) => {
      let h = 4
      if (live !== null) {
        h = 4 + Math.min(1, Math.sqrt(levelHist[i] / LEVEL_FULL_SCALE)) * 26
      } else if (s === 'idle') {
        // Gentle breathing so the bar always feels alive
        h = 3 + Math.abs(Math.sin(t / 2400 + i * 0.4)) * 2.5
      } else if (s === 'active') {
        h = 4 + Math.abs(Math.sin(t / 1600 + i * 0.32)) * 4
      } else if (s === 'listening') {
        h = 6 + Math.abs(Math.sin(t / 105 + i * 0.75)) * 23
      } else if (s === 'dictating') {
        // Driven by the native mic level (dictation-level event), with a little motion so quiet moments still breathe.
        const lvl = dictLevel()
        h = 4 + Math.min(1, lvl * 1.6) * (6 + Math.abs(Math.sin(t / 110 + i * 0.7)) * 20)
      } else if (s === 'thinking' || s === 'dictation-processing') {
        const phase = (t / 260 + i * 0.5) % (BAR_COUNT * 0.5)
        h = 4 + Math.max(0, 21 - Math.abs(phase - BAR_COUNT * 0.25) * 3)
      } else if (s === 'speaking') {
        h = 5 + Math.abs(Math.sin(t / 92 + i * 0.9)) * 19
      } else if (s === 'running') {
        h = 4   // static: the work indicator lives on the agent badge icon
      } else if (s === 'announcing') {
        // Travelling wave, L→R: something arrived from outside, as opposed to
        // boot's centre-out "waking up" or speaking's conversational bounce.
        const phase = (t / 150 - i * 0.55) % 7
        h = 5 + Math.max(0, 17 - Math.abs(phase - 1.5) * 9)
      } else if (s === 'boot') {
        // Center-out ripple — the "AI arriving" wave
        const center = (BAR_COUNT - 1) / 2
        const dist = Math.abs(i - center)
        const wave = Math.sin(t / 115 - dist * 0.55)
        h = 6 + Math.max(0, wave) * Math.max(4, 22 - dist * 1.5)
      }
      b.style.height = h.toFixed(1) + 'px'
    })
    rafId = requestAnimationFrame(tick)
  }
  rafId = requestAnimationFrame(tick)
}

// ── Transcript reveal ─────────────────────────────────────────────────────────
const transcriptEl = document.getElementById('transcript')
let transcriptHideTimer = null
let transcriptScrollTimer = null

function showTranscript(text, holdMs = 8000, { deleg = false } = {}) {
  clearTimeout(transcriptHideTimer)
  transcriptHideTimer = null
  stopKaraoke()
  transcriptEl.classList.toggle('deleg', deleg)
  transcriptEl.innerHTML = ''

  // Words wrap the per-letter spans so a word can be highlighted as a unit
  // while the reveal still animates character by character.
  const track = document.createElement('span')
  track.className = 'track'
  const words = []
  let charIndex = 0
  const perChar = Math.max(13, Math.min(34, 900 / Math.max(text.length, 1)))

  // Split keeping the separators, so spacing survives the round trip.
  for (const piece of text.split(/(\s+)/)) {
    if (!piece) continue
    const isSpace = /^\s+$/.test(piece)
    const wordEl = document.createElement('span')
    wordEl.className = isSpace ? 'w sp-w' : 'w'
    for (const ch of piece) {
      const span = document.createElement('span')
      span.className = 'ch' + (ch === ' ' ? ' sp' : '')
      span.textContent = ch === ' ' ? ' ' : ch
      span.style.animationDelay = (charIndex * perChar) + 'ms'
      wordEl.appendChild(span)
      charIndex++
    }
    if (!isSpace) {
      words.push({ el: wordEl, start: charIndex - piece.length, end: charIndex })
    }
    track.appendChild(wordEl)
  }

  const caret = document.createElement('span')
  caret.className = 'caret'
  track.appendChild(caret)
  transcriptEl.appendChild(track)
  transcriptEl.classList.add('visible')
  bodyClasses()

  // One forced layout per sentence: measure every word at rest, then never
  // read layout again while the highlight moves.
  for (const w of words) w.pad = Math.round(w.el.offsetWidth * (KARAOKE_ZOOM - 1) / 2)

  karaoke = { track, words, total: charIndex, overflow: 0, active: -1 }
  karaoke.overflow = Math.max(0, track.scrollWidth - transcriptEl.clientWidth)

  // Fallback when there's no audio to follow (the user's own transcript, or a
  // `say` fallback): time-based scroll so a long line still reads through.
  clearTimeout(transcriptScrollTimer)
  const revealMs = charIndex * perChar + 300
  let scrollMs = 0
  if (karaoke.overflow > 4) {
    scrollMs = Math.round((karaoke.overflow / 70) * 1000) + 1500
    transcriptScrollTimer = setTimeout(() => {
      // Karaoke took over in the meantime — leave it alone.
      if (karaoke && karaoke.driven) return
      track.style.transition = 'transform ' + (scrollMs - 1500) + 'ms linear'
      track.style.transform = 'translateX(-' + karaoke.overflow + 'px)'
    }, revealMs + 600)
  }

  // holdMs = 0 → no auto-hide (live speech: the next sentence or the
  // speaking-done handler decides). Otherwise never hide mid-scroll.
  if (holdMs > 0) {
    transcriptHideTimer = setTimeout(hideTranscript, Math.max(holdMs, revealMs + scrollMs))
  }
}

// ── Karaoke ───────────────────────────────────────────────────────────────────
// Highlight follows the AUDIO, not a guessed reading speed: progress through
// the WAV maps to progress through the sentence. It's linear rather than
// phoneme-aligned — the daemons return a WAV, not word timings — but over one
// short sentence at a steady speaking rate it tracks closely, and it can never
// drift out of sync with the voice the way a fixed px/s scroll does.
const KARAOKE_ZOOM = 1.2
let karaoke = null
let karaokeRaf = 0

function stopKaraoke() {
  if (karaokeRaf) cancelAnimationFrame(karaokeRaf)
  karaokeRaf = 0
  karaoke = null
  transcriptEl.classList.remove('karaoke')
}

function driveKaraoke(audio) {
  if (!karaoke || !karaoke.words.length) return
  karaoke.driven = true
  transcriptEl.classList.add('karaoke')
  // Drop the timed scroll: the audio drives position from here on.
  karaoke.track.style.transition = 'transform 0.18s linear'

  const step = () => {
    if (!karaoke || !audio || audio.paused || audio.ended) {
      karaokeRaf = 0
      return
    }
    const dur = audio.duration
    if (dur && isFinite(dur) && dur > 0) {
      const p = Math.min(1, audio.currentTime / dur)
      const at = p * karaoke.total
      let idx = karaoke.words.findIndex((w) => at < w.end)
      if (idx < 0) idx = karaoke.words.length - 1

      if (idx !== karaoke.active) {
        const prev = karaoke.active
        karaoke.active = idx
        // Only touch the two words that changed — repainting all of them every
        // step is what makes a karaoke line shimmer.
        for (const i of [prev, idx]) {
          const w = karaoke.words[i]
          if (!w) continue
          const on = i === idx
          w.el.classList.toggle('spoken', on)
          w.el.style.transform = on ? 'scale(' + KARAOKE_ZOOM + ')' : ''
          // Exactly the width the zoom will claim on each side — measured from
          // this word, so a long word gets more room than a short one.
          w.el.style.margin = on ? '0 ' + w.pad + 'px' : ''
        }
        // Keep the spoken word in view, a third in from the left so the next
        // few words are already readable.
        if (karaoke.overflow > 4) {
          const target = karaoke.words[idx].el.offsetLeft - transcriptEl.clientWidth * 0.33
          const x = Math.max(0, Math.min(karaoke.overflow, target))
          karaoke.track.style.transform = 'translateX(-' + x + 'px)'
        }
      }
    }
    karaokeRaf = requestAnimationFrame(step)
  }
  if (!karaokeRaf) karaokeRaf = requestAnimationFrame(step)
}

function hideTranscript() {
  transcriptEl.classList.remove('visible')
  stopKaraoke()
  clearTimeout(transcriptScrollTimer)
  clearTimeout(transcriptHideTimer)
  transcriptHideTimer = null
  voxIsShowing = false
  bodyClasses()
}

// ── VAD core ──────────────────────────────────────────────────────────────────
let audioCtx = null, analyser = null, processor = null, micStream = null
let pcmChunks = [], isRecording = false, currentAudio = null
let ttsStartedAt = null, silenceTimer = null, rafVAD = null, speechOnsetAt = null
let ambientRMS = SPEECH_THRESHOLD * 0.5

// Opening a Bluetooth headset's mic flips it into narrow-band "call" mode and
// wrecks playback quality. While listening, the backend points the system
// default input at the built-in mic (restored in deactivateVox), so the headset
// stays on high-quality output — like the system dictation key.
async function routeMic() {
  try { await invoke('route_mic_away_from_bluetooth') } catch (err) {
    console.warn('[vox] mic routing failed:', err)
  }
}
// Like the system dictation: everything else the Mac plays is silenced for the
// whole time Vox is listening (mic open, until Vox talks), then fades back in.
// Vox's own voice plays from the webview, so it must not be ducked.
let othersDucked = false
function syncDuck(s) {
  const want = !!micStream && (s === 'active' || s === 'listening' || s === 'thinking')
  if (want === othersDucked) return
  othersDucked = want
  invoke('duck_other_audio', { on: want }).catch(() => {})
}
function restoreMicRoute() {
  invoke('restore_mic_route').catch(() => {})
}

async function activateVox() {
  if (micStream) return
  try {
    await routeMic()
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    })
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new AudioContext({ sampleRate: 16000 })
    } else if (audioCtx.state === 'suspended') {
      await audioCtx.resume()
    }
    const source = audioCtx.createMediaStreamSource(micStream)
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 512
    source.connect(analyser)
    processor = audioCtx.createScriptProcessor(2048, 1, 1)
    processor.onaudioprocess = (e) => {
      if (isRecording && !currentAudio) {
        pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))
      }
    }
    source.connect(processor)
    processor.connect(audioCtx.destination)
    setState('active')
    vadTick()
  } catch (err) {
    console.error('[vox] activateVox failed:', err.message)
    restoreMicRoute()
  }
}

function deactivateVox() {
  cancelAnimationFrame(rafVAD)
  clearTimeout(silenceTimer)
  silenceTimer = null
  isRecording = false
  currentAudio = null
  pcmChunks = []
  speechOnsetAt = null
  processor?.disconnect()
  analyser?.disconnect()
  processor = null
  analyser = null
  micStream?.getTracks().forEach(t => t.stop())
  micStream = null
  audioCtx?.suspend()
  restoreMicRoute()
  setState(agentCount > 0 ? 'running' : 'idle')
}

function getRMS() {
  const buf = new Float32Array(analyser.fftSize)
  analyser.getFloatTimeDomainData(buf)
  let sum = 0; for (const s of buf) sum += s * s
  return Math.sqrt(sum / buf.length)
}

function vadTick() {
  if (!analyser) return
  const rms = getRMS()

  if (currentAudio) {
    // Barge-in only while Vox is answering YOU. During an unprompted
    // announcement you never opened the mic, so a level above the threshold is
    // Vox hearing itself through the speakers — and the durable queue then
    // faithfully re-speaks what it thinks you cut off. That is where the
    // intermittent duplicate announcements came from. ⌥Space still stops one.
    if (state !== 'announcing'
        && rms > BARGE_IN_THRESHOLD && ttsStartedAt && Date.now() - ttsStartedAt > 1200) {
      currentAudio.pause()
      currentAudio = null
      isRecording = false
      pcmChunks = []
      clearTimeout(silenceTimer); silenceTimer = null
      // interrupt (not audio_done): aborts the WHOLE queued session, not
      // just the current sentence — otherwise the next sentence plays on.
      invoke('interrupt')
      setState('active')
    }
  } else if (state === 'active' || state === 'running') {
    if (!isRecording) {
      const triggerThreshold = Math.max(SPEECH_THRESHOLD, ambientRMS * SPEECH_SNR)
      if (rms > triggerThreshold) {
        if (!speechOnsetAt) speechOnsetAt = Date.now()
        else if (Date.now() - speechOnsetAt > SPEECH_ONSET_MS) {
          isRecording = true
          pcmChunks = []
          speechOnsetAt = null
          clearTimeout(silenceTimer); silenceTimer = null
          hideTranscript()
          setState('listening')
        }
      } else {
        speechOnsetAt = null
        ambientRMS = ambientRMS * (1 - AMBIENT_ALPHA) + rms * AMBIENT_ALPHA
      }
    }
  } else if (state === 'listening') {
    if (rms < SILENCE_THRESHOLD) {
      if (!silenceTimer) silenceTimer = setTimeout(sendSpeech, SILENCE_MS)
    } else {
      clearTimeout(silenceTimer); silenceTimer = null
    }
  }

  rafVAD = requestAnimationFrame(vadTick)
}

function sendSpeech() {
  clearTimeout(silenceTimer); silenceTimer = null
  if (!isRecording) return
  isRecording = false

  const totalSamples = pcmChunks.reduce((n, c) => n + c.length, 0)
  const sampleRate = audioCtx?.sampleRate || 16000

  if (totalSamples < MIN_SPEECH_SAMPLES) {
    pcmChunks = []
    setState(micStream ? 'active' : 'idle')
    return
  }

  setState('thinking')
  const merged = new Float32Array(totalSamples)
  let off = 0; for (const c of pcmChunks) { merged.set(c, off); off += c.length }
  pcmChunks = []

  invoke('voice_input', { wav: abToB64(encodeWAV(merged, sampleRate)) })
}

function abToB64(buf) {
  const u8 = new Uint8Array(buf)
  let s = ''
  const CH = 0x8000
  for (let i = 0; i < u8.length; i += CH) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + CH))
  }
  return btoa(s)
}

function encodeWAV(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2)
  const v = new DataView(buf)
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true)
  str(8, 'WAVE'); str(12, 'fmt ')
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true)
  v.setUint16(32, 2, true); v.setUint16(34, 16, true)
  str(36, 'data'); v.setUint32(40, samples.length * 2, true)
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]))
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true)
  }
  return buf
}

function interruptSpeech() {
  if (currentAudio) {
    try { currentAudio.pause() } catch {}
    currentAudio = null
  }
  invoke('interrupt')  // stops in-flight playback + aborts a pending brief
  closeCarousel(0)     // don't leave the recap cards hanging on screen
  setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
}

async function toggleVox() {
  // During first-run setup the pill only shows install progress.
  if (setupOpen || dictBusy()) return
  // ⌥Space stops the startup recap (boot), a reply being spoken (speaking), or
  // an unprompted announcement. 'thinking' stays a no-op: interrupting an
  // in-flight LLM call and letting a new turn start would race the abandoned
  // reply onto the voice.
  // An interrupted announcement is NOT lost, but it does not come back by
  // itself either: the backend parks it (badge count stays, a badge click
  // replays it). ⌥Space means stop.
  if (state === 'boot' || state === 'speaking' || state === 'announcing') {
    interruptSpeech()
    return
  }
  if (state === 'idle' || state === 'running') {
    await activateVox()
  } else if (state !== 'thinking') {
    deactivateVox()
  }
}

// ── Dictation (configurable key → text pasted at the cursor) ─────────────────
// Fully native: Rust owns the key, the recording (with pre-roll), the
// transcription and the paste. This side only reflects state: pill colours, the
// live level in the waveform, hints. It never opens the mic for dictation.
let dictHideTimer = null
let dictKey = 'fn'
let dictLvlTarget = 0, dictLvlSmooth = 0, dictLvlAt = 0

function dictBusy() { return state === 'dictating' || state === 'dictation-processing' }

function dictKeyShort(key) {
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  return (L.dictKeysShort && L.dictKeysShort[key]) || key || 'fn'
}

// Smoothed live level (0..1) from the `dictation-level` event; fast attack, slow
// release, and it decays by itself if events stop arriving.
function dictLevel() {
  if (Date.now() - dictLvlAt > 250) dictLvlTarget = 0
  const k = dictLvlTarget > dictLvlSmooth ? 0.5 : 0.15
  dictLvlSmooth += (dictLvlTarget - dictLvlSmooth) * k
  return dictLvlSmooth
}

function dictRestState() { return agentCount > 0 ? 'running' : 'idle' }

function startDictation(app, key) {
  clearTimeout(dictHideTimer)
  if (key) dictKey = key
  dictLvlTarget = dictLvlSmooth = 0
  // Quiet Vox: whatever it was saying or about to say must not reach the mic.
  if (currentAudio) { try { currentAudio.pause() } catch {}; currentAudio = null }
  if (state === 'speaking' || state === 'boot' || state === 'announcing') {
    invoke('interrupt').catch(() => {})
  }
  closeCarousel(0)
  // End an active ⌥Space session cleanly (releases its mic, resets VAD state).
  // A turn still 'thinking' is simply superseded: its late speaking-* / play-wav
  // events are ignored while dictating (see guards in the listeners).
  if (micStream) deactivateVox()
  hideTranscript()
  setState('dictating')
  if (app) setLabel('✎ ' + app)
}

function stopDictation() {
  if (state !== 'dictating') return      // stale event
  dictLvlTarget = 0
  setState('dictation-processing')
  hideTranscript()
}

function cancelDictation() {
  dictLvlTarget = 0
  hideTranscript()
  if (dictBusy()) setState(dictRestState())
}

function finishDictation(p) {
  if (state === 'dictating') return      // a newer dictation already started
  hideTranscript()
  if (dictBusy()) setState(dictRestState())
  const text = ((p && p.text) || '').trim()
  voxIsShowing = false
  if (p && p.ok && text) showTranscript(text, 2800)
  else if (p && !p.ok) showTranscript((uiLang === 'en' ? 'dictation failed — ' : 'dictée échouée — ') + ((p.error || '').trim() || '?'), 4000)
}

listen('dictation-start', (e) => {
  const pl = e.payload || {}
  startDictation((pl.app || '').trim(), pl.key)
})
listen('dictation-level', (e) => {
  const v = Number((e.payload || {}).level)
  if (!isFinite(v)) return
  dictLvlTarget = Math.max(0, Math.min(1, v))
  dictLvlAt = Date.now()
})
listen('dictation-stop', () => { stopDictation() })
listen('dictation-cancel', () => { cancelDictation() })
listen('dictation-latched', () => {
  if (state !== 'dictating') return
  voxIsShowing = false
  showTranscript((LABEL_TABLE[uiLang] || LABEL_TABLE.fr).dictLatched.replace('%s', dictKeyShort(dictKey)), 0)
})
listen('dictation-done', (e) => { finishDictation(e.payload) })


// ── Idle drop ─────────────────────────────────────────────────────────────────
// Any use of Vox re-arms the timer; when it fires on a quiet pill we morph.
function noteActivity() {
  clearTimeout(dropTimer)
  dropTimer = null
  if (dropAfterMs <= 0) return
  dropTimer = setTimeout(() => {
    const quiet = (state === 'idle' || state === 'running') && !hovered
      && !carouselOpen && !setupOpen && !userDragging
      && !transcriptEl.classList.contains('visible') && !appearing && !returning
    if (dropAfterMs > 0 && !dropped && quiet) enterDrop()
    else noteActivity()
  }, dropAfterMs)
}

function enterDrop() {
  if (dropped) return
  dropped = true
  bodyClasses()
  syncWindow(DROP_MS)
}

function wake() {
  if (!dropped) { noteActivity(); return }
  dropped = false
  bodyClasses()
  syncWindow(WAKE_MS)
  noteActivity()
}

// ── Pill sizing (settings / carousel / setup) ────────────────────────────────
// durOverride: set for the drop's own morphs (enter / wake / hover swell).
function syncWindow(durOverride) {
  let w, h
  if (dropped) {
    const s = hovered ? DROP_HOVER_SIZE : DROP_SIZE
    ;[w, h] = [s, s]
  } else if (setupOpen) {
    ;[w, h] = SIZE_SETUP
  } else if (carouselOpen) {
    const cards = carouselEl.children.length
    w = 500
    h = 40 + 22 + 30 + Math.min(Math.max(cards, 1), 4) * 45  // +30: action row
  } else {
    ;[w, h] = SIZE_BASE
  }
  // Called on every hover change too — skip when nothing moved.
  if (lastPill && lastPill[0] === w && lastPill[1] === h) return
  const first = !lastPill
  const grows = !first && (w > lastPill[0] || h > lastPill[1])
  lastPill = [w, h]
  const durationMs = first || reducedMotion.matches ? 0
    : (durOverride ?? (grows ? GROW_MS : SHRINK_MS))
  // Duration first, size in the same style recalc: the transition picks up the
  // new duration. First paint gets 0 so the pill doesn't animate from nothing.
  shellEl.style.setProperty('--pill-dur', durationMs + 'ms')
  shellEl.style.setProperty('--pill-w', w + 'px')
  shellEl.style.setProperty('--pill-h', h + 'px')
  invoke('set_pill_frame', { width: w, height: h, durationMs }).catch(() => {})
}

// ── Worktree carousel ─────────────────────────────────────────────────────────
const carouselEl = document.getElementById('carousel')

function buildCarousel(list) {
  carouselEl.innerHTML = ''
  for (const w of list) {
    const card = document.createElement('div')
    card.className = 'ws-card'
    card.dataset.project = (w.project || '').toLowerCase()
    card.dataset.status = w.status || 'none'
    const dot = document.createElement('span'); dot.className = 'ws-status'
    const name = document.createElement('span'); name.className = 'ws-name'
    name.textContent = w.project || '?'
    const meta = document.createElement('span'); meta.className = 'ws-meta'
    meta.textContent = [w.agent, w.preview].filter(Boolean).join(' — ')
    card.append(dot, name, meta)
    if (w.unread > 0) {
      const badge = document.createElement('span')
      badge.className = 'ws-unread'
      badge.textContent = w.unread
      card.appendChild(badge)
    }
    carouselEl.appendChild(card)
  }
}

function openCarousel() {
  clearTimeout(carouselCloseTimer)
  if (carouselOpen) return
  noteActivity()
  if (dropped) wake()
  carouselOpen = true
  bodyClasses()
  syncWindow()
}

// Click the pill to show or dismiss the worktree list.
function toggleCarousel() {
  if (setupOpen) return
  noteActivity()
  if (carouselOpen) {
    closeCarousel(0)
  } else {
    openCarousel()
  }
}

function closeCarousel(delay = 0) {
  clearTimeout(carouselCloseTimer)
  carouselCloseTimer = setTimeout(() => {
    if (!carouselOpen) return
    carouselOpen = false
    noteActivity()
    bodyClasses()
    syncWindow()
  }, delay)
}

function highlightWorkspace(name) {
  if (!carouselOpen || !name) return
  const sel = `.ws-card[data-project="${CSS.escape(String(name).toLowerCase())}"]`
  const target = carouselEl.querySelector(sel)
  for (const c of carouselEl.querySelectorAll('.ws-card')) {
    c.classList.toggle('speaking', c === target)
  }
  if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' })
}

let hoverOutTimer = null
let userDragging = false

// ── Dragging the pill ─────────────────────────────────────────────────────────
// Done here rather than by AppKit: the window is a non-activating NSPanel (so it
// can appear over other apps' fullscreen Spaces), and such a panel never becomes
// key on click, so AppKit's movableByWindowBackground drag loop never starts.
//
// Pointer capture is what makes this reliable — events keep arriving even when
// the cursor outruns the window, which a plain mousemove listener would lose.
// Deltas are accumulated and flushed once per frame so a fast drag doesn't
// queue hundreds of IPC calls.
let dragState = null
let dragRaf = 0

function flushDrag() {
  dragRaf = 0
  if (!dragState || (!dragState.dx && !dragState.dy)) return
  const { dx, dy } = dragState
  dragState.dx = 0
  dragState.dy = 0
  invoke('move_pill', { dx, dy }).catch(() => {})
}

document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  // Never hijack a real control.
  if (e.target?.closest?.('button, select, input, .ws-card, .setup-chip')) return
  if (!e.target?.closest?.('[data-tauri-drag-region]')) return
  noteActivity()
  dragState = { x: e.screenX, y: e.screenY, dx: 0, dy: 0, moved: 0, id: e.pointerId }
  userDragging = true
  try { e.target.setPointerCapture(e.pointerId) } catch {}
})

document.addEventListener('pointermove', (e) => {
  if (!dragState || e.pointerId !== dragState.id) return
  dragState.moved += Math.abs(e.screenX - dragState.x) + Math.abs(e.screenY - dragState.y)
  dragState.dx += e.screenX - dragState.x
  dragState.dy += e.screenY - dragState.y
  dragState.x = e.screenX
  dragState.y = e.screenY
  if (!dragRaf) dragRaf = requestAnimationFrame(flushDrag)
})

function endDrag(e) {
  if (!dragState) return
  flushDrag()
  const moved = dragState.moved
  try { e?.target?.releasePointerCapture?.(dragState.id) } catch {}
  dragState = null
  userDragging = false
  // A press that didn't travel is a click, not a drag: that's the gesture for
  // showing the worktree list.
  // On the drop, a click wakes it instead.
  if (moved < 4) { if (dropped) wake(); else toggleCarousel() }
}
document.addEventListener('pointerup', endDrag)
document.addEventListener('pointercancel', endDrag)

// Hover comes from Rust: the window is a big transparent envelope that ignores
// the mouse outside the pill, so DOM mouseenter/leave on body can't tell us.
listen('pill-hover', (e) => {
  if (e.payload) {
    userDragging = false  // native drag swallows mouseup — reset here
    clearTimeout(hoverOutTimer)
    noteActivity()
    if (hovered) return
    hovered = true
    bodyClasses()
    syncWindow(dropped ? DROP_HOVER_MS : undefined)
    return
  }
  noteActivity()
  if (userDragging) return
  // Small grace period so edge-crossing doesn't flicker
  clearTimeout(hoverOutTimer)
  hoverOutTimer = setTimeout(() => {
    hovered = false
    noteActivity()
    bodyClasses()
    syncWindow(dropped ? DROP_HOVER_MS : undefined)
  }, 140)
})

// ── Setup panel (first-run auto-install) ─────────────────────────────────────
const setupGrid = document.getElementById('setup-grid')
const setupLog = document.getElementById('setup-log')
const setupBtn = document.getElementById('setup-btn')
const setupStatus = document.getElementById('setup-status')

// Not required for Vox to run: absent renders neutral, never as a failure.
const OPTIONAL_COMPONENTS = new Set(['qwen3', 'qwen3Model'])

function renderSetup(probe) {
  const labels = COMP_LABELS[uiLang] || COMP_LABELS.fr
  setupGrid.innerHTML = ''
  const comps = (probe && probe.components) || {}
  for (const key of Object.keys(COMP_LABELS.fr)) {
    const c = comps[key]
    if (!c) continue
    const chip = document.createElement('div')
    chip.className = 'setup-chip ' + (c.ok ? 'ok' : 'miss')
      + (OPTIONAL_COMPONENTS.has(key) ? ' opt' : '')
    const dot = document.createElement('span'); dot.className = 'sdot'
    const name = document.createElement('span'); name.className = 'sname'
    name.textContent = labels[key]
    const detail = document.createElement('span'); detail.className = 'sdetail'
    detail.textContent = (c.detail && c.detail !== 'ok') ? c.detail : ''
    detail.title = c.detail || ''
    chip.append(dot, name, detail)
    setupGrid.appendChild(chip)
  }
}

function appendLog(tag, line) {
  const row = document.createElement('div')
  const t = document.createElement('span')
  t.className = 'ln-tag'
  t.textContent = tag
  row.append(t, document.createTextNode(line))
  setupLog.appendChild(row)
  setupLog.scrollTop = setupLog.scrollHeight
}

function setSetupStatus(cls, text) {
  setupStatus.className = 'setup-status' + (cls ? ' ' + cls : '')
  setupStatus.textContent = text
}

function setSetupBtn(text, running) {
  setupBtn.textContent = text
  setupBtn.disabled = !!running
}

function renderSetupI18n() {
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  document.getElementById('setup-title').textContent = labels.setupTitle
  if (!setupRunning) setSetupBtn(labels.setupInstall, false)
  renderSetup(lastProbe)
}
let lastProbe = null

function openSetup() {
  noteActivity()
  dropped = false
  carouselOpen = false
  setupOpen = true
  bodyClasses()
  syncWindow()
}

function closeSetup() {
  if (!setupOpen) return
  setupOpen = false
  noteActivity()
  bodyClasses()
  syncWindow()
}

async function startSetup() {
  if (setupRunning) return
  setupRunning = true
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setSetupBtn(labels.setupInstall, true)
  setSetupStatus('busy', labels.setupStatusBusy)
  setupLog.innerHTML = ''
  try {
    const probe = await invoke('run_setup')
    setupRunning = false
    lastProbe = probe
    renderSetup(probe)
    if (!probe.needsSetup) {
      setSetupStatus('ok', labels.setupStatusOk)
      setSetupBtn(labels.setupDone, false)
      setTimeout(closeSetup, 2200)
    } else {
      setSetupStatus('bad', labels.setupStatusFail)
      setSetupBtn(labels.setupRetry, false)
    }
  } catch (err) {
    setupRunning = false
    appendLog('setup', String(err.message || err))
    setSetupStatus('bad', labels.setupStatusFail)
    setSetupBtn(labels.setupRetry, false)
  }
}

function maybeAutoSetup(probe) {
  if (setupInitiated || !probe || !probe.needsSetup) return
  setupInitiated = true
  openSetup()
  renderSetup(probe)
  startSetup()
}

setupBtn.addEventListener('click', () => {
  if (setupRunning) return
  if (setupBtn.textContent === (LABEL_TABLE[uiLang] || LABEL_TABLE.fr).setupDone) {
    closeSetup()
    return
  }
  startSetup()
})

// ── Live settings (from the Settings window) ─────────────────────────────────
// What the pill itself acts on: UI language, dictation key, tint, idle drop.
let curSettings = {}

function applyTransparency(t) {
  const v = Math.min(100, Math.max(0, Number(t)))
  const a = (0.62 * (1 - v / 100)).toFixed(3)
  document.documentElement.style.setProperty('--tint-a', a)
}

function applyVisualSettings(s) {
  applyTransparency(Number.isFinite(s.glass_transparency) ? s.glass_transparency : 40)
  const secs = Number.isFinite(s.drop_after_secs) ? s.drop_after_secs : 180
  dropAfterMs = secs * 1000
  noteActivity()
}

function applyUiLang() {
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  renderSetupI18n()
  lastLabel = ''
  setLabel(labels[state] || '')
}

function applySettings(s) {
  Object.assign(curSettings, s)
  uiLang = s.language || 'fr'
  dictKey = s.dictation_key || 'fn'
  applyVisualSettings(s)
  applyUiLang()
}

listen('settings-changed', (e) => { if (e.payload) applySettings(e.payload) })
listen('setup-open', async () => {
  openSetup()
  try {
    const probe = await invoke('probe_setup')
    lastProbe = probe
    renderSetup(probe)
    if (probe.needsSetup) startSetup()
  } catch {}
})

const qwenBtn = document.getElementById('qwen-btn')
qwenBtn.addEventListener('click', async () => {
  if (setupRunning) return
  setupRunning = true
  qwenBtn.disabled = true
  const L = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setSetupStatus('busy', L.setupStatusBusy)
  try {
    lastProbe = await invoke('install_engine', { name: 'qwen3' })
    renderSetup(lastProbe)
    setSetupStatus(lastProbe.qwenReady ? 'ok' : 'bad',
                   lastProbe.qwenReady ? L.setupStatusOk : L.setupStatusFail)
  } catch (err) {
    appendLog('qwen', String((err && err.message) || err))
    setSetupStatus('bad', L.setupStatusFail)
  }
  setupRunning = false
  qwenBtn.disabled = false
})


// Recap button — replay the worktree recap on demand. Ignored while Vox is
// already busy talking/listening/thinking (sessions would just queue up),
// and debounced: a double-click must not queue two recaps.
let lastRecapAt = 0
document.getElementById('recap-btn').addEventListener('click', () => {
  const now = Date.now()
  if (now - lastRecapAt < 1500) return
  if (state === 'idle' || state === 'active' || state === 'running') {
    lastRecapAt = now
    invoke('replay_recap')
  }
})



// ── Events from Rust ─────────────────────────────────────────────────────────
// Restarting a CSS animation needs the class off, a forced reflow, then on —
// otherwise re-adding it is a no-op and nothing plays.
function replay(setFlag, ms) {
  setFlag(false)
  bodyClasses()
  void document.body.offsetWidth
  setFlag(true)
  bodyClasses()
  return setTimeout(() => { setFlag(false); bodyClasses() }, ms)
}

let appearTimer = null
let returnTimer = null

// First show only: Rust keeps the window hidden for 400ms, so this genuinely
// starts from nothing and can afford to fade and rise.
function playEntrance() {
  clearTimeout(appearTimer)
  appearTimer = replay((v) => { appearing = v }, 500)
}

// Back from another Space. We find out AFTER the compositor has drawn the pill,
// so this must never start from invisible.
function playReturn() {
  clearTimeout(returnTimer)
  returnTimer = replay((v) => { returning = v }, 620)
}
listen('pill-appear', playReturn)
listen('pill-shown', playEntrance)

listen('toggle-listening', toggleVox)

listen('setup-needed', (e) => {
  lastProbe = e.payload
  maybeAutoSetup(e.payload)
})

listen('setup-log', (e) => {
  appendLog(e.payload.tag || 'setup', e.payload.line || '')
})

// Last-resort unbricking. The pill only leaves a speaking state on
// speaking-done, so ANY backend path that fails to emit it would strand the UI
// until restart. This makes that impossible regardless of backend bugs.
let lastSpeechSignal = Date.now()
const SPEECH_STALL_MS = 150000
setInterval(() => {
  const stuck = state === 'thinking' || state === 'boot'
             || state === 'speaking' || state === 'announcing'
  if (stuck && Date.now() - lastSpeechSignal > SPEECH_STALL_MS) {
    console.warn('[vox] speech state stalled — force-settling')
    currentAudio = null
    setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
  }
}, 5000)

listen('speaking-start', () => {
  if (dictBusy()) return   // a superseded reply must not hijack the dictation UI
  lastSpeechSignal = Date.now()
  ttsStartedAt = Date.now()
  setState('speaking')
})

listen('speaking-done', () => {
  currentAudio = null
  // Settle from any TTS/pending state. 'thinking' MUST be included: error
  // paths (Ollama down, empty transcript, empty tool text) emit speaking-done
  // without ever emitting speaking-start, and 'thinking' has no other exit —
  // excluding it bricked the pill until restart. 'active'/'listening' stay
  // protected from late duplicate speaking-done events.
  if (state === 'speaking' || state === 'boot' || state === 'thinking' || state === 'announcing') {
    setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
  }
  if (carouselOpen) closeCarousel(1400)
  if (transcriptEl.classList.contains('visible')) {
    clearTimeout(transcriptHideTimer)
    // Clear out promptly once the voice stops. Leaving the last sentence up for
    // 45s meant the pill spent most of its life displaying something already
    // said — the bar should return to rest when Vox is done.
    transcriptHideTimer = setTimeout(hideTranscript, voxIsShowing ? 2200 : 1300)
  }
})

// TTS audio: played here so echo cancellation enables barge-in. Payload is
// one queued sentence: { path, workspace?, id } — the workspace tag drives
// the carousel, the id makes the done-ack idempotent (a failed load fires
// both onerror AND play().catch; a duplicate ack must not consume the NEXT
// sentence's wait on the Rust side).
listen('play-wav', (e) => {
  if (dictBusy()) {        // never play over a dictation; ack so the queue drains
    invoke('audio_done', { id: e.payload.id })
    return
  }
  lastSpeechSignal = Date.now()
  const src = convertFileSrc(e.payload.path)
  const id = e.payload.id
  if (e.payload.workspace) {
    // Sessions serialize on the Rust side, so the recap may start speaking
    // after another reply's speaking-done already closed the carousel —
    // reopen it lazily whenever a workspace-tagged sentence plays.
    if (!carouselOpen && carouselEl.children.length > 0) openCarousel()
    highlightWorkspace(e.payload.workspace)
  }
  let acked = false
  const finish = () => {
    if (acked) return
    acked = true
    currentAudio = null
    invoke('audio_done', { id })
  }
  const audio = new Audio(src)
  currentAudio = audio
  audio._env = null
  // Real loudness for the waveform; on any failure the bars keep their
  // synthetic motion for this clip.
  loadEnvelope(src).then((env) => { audio._env = env }).catch((err) => {
    console.warn('[vox] envelope unavailable:', err)
  })
  currentAudio.onended = finish
  currentAudio.onerror = finish
  // Highlight + scroll follow this clip's playback position.
  currentAudio.onplaying = () => driveKaraoke(currentAudio)
  currentAudio.play().then(() => driveKaraoke(currentAudio)).catch(finish)
})

// Worktree cards for the recap carousel — arrives just before the brief.
// Only auto-open from a resting/boot state; never yank the UI open while the
// user is mid-recording or mid-reply (play-wav reopens it lazily anyway).
listen('workspaces-data', (e) => {
  // Build only. The watcher refreshes this every 30s, so auto-opening here kept
  // the worktree list permanently on screen with no way to dismiss it. It opens
  // for the startup recap (which is about those cards) and otherwise when you
  // click the pill.
  buildCarousel(Array.isArray(e.payload) ? e.payload : [])
  if (state === 'boot') openCarousel()
})

listen('agent-status', (e) => {
  agentCount = e.payload.count
  agentLabels = (e.payload.agents || []).map((a) => a.label).filter(Boolean)
  if (state !== 'listening' && state !== 'thinking' && state !== 'speaking'
      && state !== 'active' && state !== 'boot' && state !== 'announcing' && !dictBusy()) {
    setState(agentCount > 0 ? 'running' : 'idle')
  } else {
    updateBadge()
  }
})

// ── Proactive announcements ───────────────────────────────────────────────
// Two invariants keep this from feeling like Clippy:
//  1. it NEVER steals the turn — the backend only speaks from a resting state,
//     and this guard mirrors that so a late event can't override a live turn;
//  2. it is interruptible on the first syllable — ⌥Space (toggleVox) and the
//     VAD barge-in path both already work, since currentAudio is set.
listen('announce-start', () => {
  // The count itself is owned by the backend (announce-pending) — it emits the
  // post-pop value just before this fires, so don't decrement here too.
  if (state === 'idle' || state === 'active' || state === 'running') {
    setState('announcing')
  } else {
    updateAnnounceBadge()
  }
})

listen('announce-pending', (e) => {
  pendingAnnouncements = e.payload.count || 0
  updateAnnounceBadge()
})

listen('announce-done', () => { updateAnnounceBadge() })

document.getElementById('announce-badge').addEventListener('click', () => {
  if (pendingAnnouncements === 0) return
  if (state === 'idle' || state === 'active' || state === 'running') {
    invoke('speak_pending_announcements')
  }
})

// The exact prompt sent to an agent. Vox says one short sentence out loud, so
// this is the only place the full drafted prompt is ever visible in headless
// mode, where the agent writes nothing the ADE could show. A native launch also
// emits this, and there the prompt is visible in the agent's own terminal too.
listen('delegation', (e) => {
  const p = e.payload || {}
  const prompt = (p.prompt || '').trim()
  if (!prompt) return
  voxIsShowing = false
  showTranscript('→ ' + (p.project || '?') + ' — ' + prompt, 14000, { deleg: true })
  if (p.project) highlightWorkspace(p.project)
})

listen('transcript', (e) => {
  if (dictBusy()) return
  if (e.payload && e.payload.trim()) {
    voxIsShowing = false
    showTranscript(e.payload.trim())
  }
})

// Live transcript of Vox's own speech, one sentence at a time. The last
// sentence sticks around after speaking-done (that's usually the advice).
let voxIsShowing = false
listen('speaking-text', (e) => {
  if (dictBusy()) return
  const t = (e.payload.text || '').trim()
  if (!t) return
  voxIsShowing = true
  showTranscript(t, 0)
})

listen('startup-brief-starting', () => {
  // Mid-utterance: finish the recording first (the recap will queue behind
  // the reply on the Rust side). Flipping to 'boot' here would strand
  // isRecording forever — vadTick has no 'boot' branch.
  if (state === 'listening') {
    sendSpeech()
    return
  }
  if (state === 'idle' || state === 'active' || state === 'running') {
    setState('boot')
  }
})

// ── Init ──────────────────────────────────────────────────────────────────────
;(async () => {
  // Initial pill size, unanimated: tells Rust where the native blur starts.
  syncWindow()
  try {
    applySettings(await invoke('get_settings'))
  } catch {}
  applyUiLang()
  setState('idle')

  // First-run setup: if the speech stack is incomplete, open the panel and
  // auto-install. Daemons stay down until run_setup completes (Rust restarts
  // them and emits no startup brief before then).
  try {
    const probe = await invoke('probe_setup')
    lastProbe = probe
    maybeAutoSetup(probe)
  } catch {}
})()

console.log('[vox renderer] ready — ⌥Space to talk, ⌘, opens Settings')
</script>
</body>
</html>
