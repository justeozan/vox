<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --green:  #4ade80;
    --amber:  #f59e0b;
    --blue:   #60a5fa;
    --violet: #a78bfa;
    --boot:   #c4b5fd;
    --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    --smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }

  html, body { height: 100%; background: transparent; }

  body {
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif;
    color: #fff;
    cursor: default;
  }

  /* ── Shell — the pill. The REAL blur is the native NSVisualEffectView
       behind this window, rounded at the same 28px radius, so the CSS layer
       only tints and outlines. Nothing can overflow: the vibrancy view is
       clipped by AppKit itself. */
  .shell {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    /* Translucent enough that the native blur reads through — with the
       vibrancy view now correctly BELOW the webview, the pill stays dark
       and premium without killing the real-time blur. */
    background: rgba(3, 3, 6, 0.46);
    border: 1px solid rgba(255, 255, 255, 0.09);
    border-radius: 28px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.06);
    overflow: hidden;
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }

  /* Glows are INSET so they follow the pill's rounded corners. An outer
     box-shadow would bleed past the pill and get clipped to the window's
     rectangle — the "square corners" behind the violet/blue layers. */
  body.boot      .shell { border-color: rgba(196,181,253,0.6); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 26px rgba(196,181,253,0.42); }
  /* Unprompted speech. Violet like the agent family, but no pulse and a much
     softer glow than boot — it announces, it doesn't demand. */
  body.announcing .shell { border-color: rgba(167,139,250,0.38); box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 16px rgba(167,139,250,0.20); }
  body.active    .shell { border-color: rgba(74,222,128,0.32); }
  body.listening .shell { border-color: rgba(74,222,128,0.6);  animation: shellPulseGreen 2.2s ease-in-out infinite; }
  body.thinking  .shell { border-color: rgba(245,158,11,0.5); }
  body.speaking  .shell { border-color: rgba(96,165,250,0.55); animation: shellPulseBlue 2.6s ease-in-out infinite; }
  body.running   .shell { border-color: rgba(167,139,250,0.4); }

  @keyframes shellPulseGreen {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 14px rgba(74,222,128,0.14); }
    50%      { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 28px rgba(74,222,128,0.34); }
  }
  @keyframes shellPulseBlue {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,0.09), inset 0 0 14px rgba(96,165,250,0.12); }
    50%      { box-shadow: inset 0 1px 0 rgba(96,165,250,0.30), inset 0 0 28px rgba(96,165,250,0.30); }
  }

  /* ── Entrance ───────────────────────────────────────────────────────────
     Only at first show, where WE control the timing (Rust holds the window
     hidden for 400ms, so this really does start from nothing). */
  body.appearing .shell { animation: pillIn 0.42s var(--spring) both; }
  @keyframes pillIn {
    from { opacity: 0; transform: translateY(10px) scale(0.965); }
    60%  { opacity: 1; }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }

  /* ── Return ─────────────────────────────────────────────────────────────
     For coming back into view after a Space switch. Deliberately NOT an
     entrance: we only learn about it after the compositor has already drawn
     the pill, so anything starting from opacity 0 flashes — it appears, blinks
     out, then fades back in. This starts from the visible state instead and
     just draws the eye: a glint crosses, and the rim lights briefly. */
  body.returning .shell { animation: pillReturn 0.55s var(--smooth); }
  @keyframes pillReturn {
    0%   { border-color: rgba(255,255,255,0.09); }
    35%  { border-color: rgba(255,255,255,0.30); box-shadow: inset 0 1px 0 rgba(255,255,255,0.06), inset 0 0 22px rgba(255,255,255,0.10); }
    100% { border-color: rgba(255,255,255,0.09); }
  }
  body.returning .boot-sweep { animation: bootSweep 0.55s var(--smooth) 1; }

  /* ── Boot sweep — violet sheen crossing once when the recap begins */
  .boot-sweep {
    position: absolute;
    inset: 0;
    pointer-events: none;
    opacity: 0;
    z-index: 3;
    background: linear-gradient(100deg,
      transparent 15%,
      rgba(196,181,253,0.05) 35%,
      rgba(196,181,253,0.30) 50%,
      rgba(196,181,253,0.05) 65%,
      transparent 85%);
    transform: translateX(-110%);
  }
  body.boot .boot-sweep { animation: bootSweep 1.1s var(--smooth) 2; }
  body.announcing .boot-sweep { animation: bootSweep 0.9s var(--smooth) 1; }
  @keyframes bootSweep {
    0%   { opacity: 0; transform: translateX(-110%); }
    25%  { opacity: 1; }
    100% { opacity: 0; transform: translateX(110%); }
  }

  /* ── Worktree carousel — vertical, scrolls to the worktree being spoken ── */
  .carousel {
    display: none;
    flex-direction: column;
    gap: 7px;
    padding: 14px 16px 4px 16px;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    scroll-behavior: smooth;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, black 14px, black calc(100% - 8px), transparent 100%);
  }
  .carousel::-webkit-scrollbar { display: none; }
  body.carousel-open .carousel { display: flex; }
  body.settings-open .carousel { display: none; } /* settings wins */

  .ws-card {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 13px;
    border: 1px solid rgba(255,255,255,0.05);
    border-radius: 13px;
    background: rgba(0,0,0,0.22);
    opacity: 0.5;
    transform: scale(0.98);
    transition: opacity 0.35s ease, transform 0.35s var(--spring),
                border-color 0.35s ease, background 0.35s ease;
  }
  .ws-card.speaking {
    opacity: 1;
    transform: scale(1);
    border-color: rgba(167,139,250,0.45);
    background: rgba(167,139,250,0.09);
  }
  .ws-status { width: 7px; height: 7px; border-radius: 50%; background: #5a5a64; flex-shrink: 0; }
  .ws-card[data-status="working"] .ws-status { background: var(--amber); box-shadow: 0 0 6px rgba(245,158,11,0.5); }
  .ws-card[data-status="idle"] .ws-status    { background: var(--green); }
  .ws-card[data-status="error"] .ws-status   { background: #f87171; box-shadow: 0 0 6px rgba(248,113,113,0.6); }
  .ws-name { font-size: 12px; font-weight: 600; color: rgba(255,255,255,0.85); white-space: nowrap; }
  .ws-meta {
    font-size: 10.5px;
    color: rgba(255,255,255,0.4);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
  }
  .ws-unread {
    font-size: 9.5px;
    font-weight: 700;
    background: rgba(167,139,250,0.2);
    border: 1px solid rgba(167,139,250,0.4);
    color: #c9b8fd;
    padding: 1px 7px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  /* ── Settings panel (above the bar; the bar stays put at the bottom) ────
     The window grows UPWARD (bottom edge pinned), so the panel content is
     bottom-anchored (justify-content:flex-end) to sit still against the bar
     while the window expands — otherwise every row slides as it grows. The
     whole panel cross-fades in once; no per-row motion. */
  .settings {
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px 22px 4px 22px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  body.settings-open .settings {
    display: flex;
    animation: settingsIn 0.3s var(--smooth) forwards;
  }
  @keyframes settingsIn { from { opacity: 0; } to { opacity: 1; } }

  .settings-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
  }

  .settings-title {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
  }
  .settings-hint { font-size: 10px; color: rgba(255,255,255,0.28); }
  .settings-hint kbd {
    font-family: inherit;
    font-size: 10px;
    padding: 1px 5px;
    border-radius: 4px;
    background: rgba(255,255,255,0.07);
    border: 1px solid rgba(255,255,255,0.09);
    margin: 0 1px;
  }

  .segment button { white-space: nowrap; }

  /* Provider + model share a row: the model list only means anything relative
     to the provider, so they read as one control. min-width:0 lets both shrink
     instead of overflowing the 500px panel. */
  .setting-pair {
    display: flex;
    gap: 7px;
    flex: 1;
    min-width: 0;
    justify-content: flex-end;
  }
  .setting-pair .setting-select {
    min-width: 0;
    flex: 1 1 0;
    max-width: 190px;
  }

  .setting-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 0;
    border-top: 1px solid rgba(255,255,255,0.05);
    min-height: 40px;
  }

  .setting-label { font-size: 12.5px; color: rgba(255,255,255,0.78); }
  .setting-value { font-size: 12px; color: rgba(255,255,255,0.5); font-variant-numeric: tabular-nums; }

  /* Update row: version + check/download button */
  .update-btn {
    -webkit-appearance: none;
    appearance: none;
    background: rgba(167,139,250,0.16);
    border: 1px solid rgba(167,139,250,0.35);
    color: #d9ceff;
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.04em;
    padding: 6px 14px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.15s var(--spring);
  }
  .update-btn:hover { background: rgba(167,139,250,0.26); border-color: rgba(167,139,250,0.55); }
  .update-btn:active { transform: scale(0.95); }
  .update-btn:disabled { opacity: 0.5; cursor: default; }
  .update-btn.ok { background: rgba(74,222,128,0.14); border-color: rgba(74,222,128,0.4); color: #b6f2cd; }

  select.setting-select {
    -webkit-appearance: none;
    appearance: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    color: #fff;
    font-size: 12px;
    padding: 6px 28px 6px 12px;
    border-radius: 9px;
    outline: none;
    font-family: inherit;
    cursor: pointer;
    max-width: 220px;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'><path fill='rgba(255,255,255,0.5)' d='M0 0l5 6 5-6z'/></svg>");
    background-repeat: no-repeat;
    background-position: right 9px center;
    transition: border-color 0.2s, background-color 0.2s, transform 0.15s var(--spring);
  }
  select.setting-select:hover { border-color: rgba(255,255,255,0.2); background-color: rgba(255,255,255,0.08); }
  select.setting-select:focus { border-color: rgba(167,139,250,0.6); }
  select.setting-select:active { transform: scale(0.97); }

  .segment {
    display: inline-flex;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.10);
    border-radius: 9px;
    padding: 2px;
    gap: 2px;
  }
  .segment button {
    background: transparent;
    border: none;
    color: rgba(255,255,255,0.55);
    font-size: 11px;
    font-family: inherit;
    font-weight: 600;
    letter-spacing: 0.05em;
    padding: 5px 13px;
    border-radius: 7px;
    cursor: pointer;
    transition: background 0.25s, color 0.25s, transform 0.2s var(--spring);
  }
  .segment button:hover { color: rgba(255,255,255,0.85); }
  .segment button:active { transform: scale(0.92); }
  .segment button.on {
    background: rgba(167,139,250,0.22);
    color: #d9ceff;
    box-shadow: inset 0 0 0 1px rgba(167,139,250,0.4);
    animation: segPop 0.3s var(--spring);
  }
  @keyframes segPop { 50% { transform: scale(1.08); } }

  /* ── Bar row — always pinned at the bottom of the pill ─────────────────── */
  .bar {
    position: relative;
    height: 56px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0 19px;
    gap: 12px;
    margin-top: auto;
  }

  /* ── Dot + listening ripple rings ──────────────────────────────────────── */
  .dot-wrap { position: relative; width: 8px; height: 8px; flex-shrink: 0; }
  .dot {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: #5a5a64;
    transition: background 0.3s, box-shadow 0.3s, transform 0.3s var(--spring);
  }
  .ring {
    position: absolute;
    inset: -1px;
    border-radius: 50%;
    border: 1.5px solid var(--green);
    opacity: 0;
    pointer-events: none;
  }
  body.active .dot    { background: var(--green);  box-shadow: 0 0 6px rgba(74,222,128,0.4); }
  body.listening .dot { background: var(--green);  box-shadow: 0 0 12px rgba(74,222,128,0.7); transform: scale(1.15); }
  body.thinking .dot  { background: var(--amber);  box-shadow: 0 0 9px rgba(245,158,11,0.6); animation: dotThink 1s ease-in-out infinite; }
  body.speaking .dot  { background: var(--blue);   box-shadow: 0 0 9px rgba(96,165,250,0.6); }
  body.running .dot   { background: var(--violet); box-shadow: 0 0 9px rgba(167,139,250,0.6); }
  body.boot .dot      { background: var(--boot);   box-shadow: 0 0 16px rgba(196,181,253,0.95); animation: bootDot 1s var(--spring); }
  body.announcing .dot { background: var(--violet); box-shadow: 0 0 12px rgba(167,139,250,0.75); animation: bootDot 0.7s var(--spring); }

  body.listening .ring.r1 { animation: ripple 1.6s ease-out infinite; }
  body.listening .ring.r2 { animation: ripple 1.6s ease-out 0.55s infinite; }
  body.speaking .ring.r1  { border-color: var(--blue); animation: ripple 2s ease-out infinite; }

  @keyframes ripple {
    0%   { opacity: 0.8; transform: scale(1); }
    100% { opacity: 0;   transform: scale(3.6); }
  }
  @keyframes dotThink {
    0%, 100% { transform: scale(1); }
    50%      { transform: scale(0.72); }
  }
  @keyframes bootDot {
    0%   { transform: scale(0.3); opacity: 0.2; }
    45%  { transform: scale(1.8); opacity: 1; }
    100% { transform: scale(1); }
  }

  /* ── Waveform ──────────────────────────────────────────────────────────── */
  .waveform {
    display: flex;
    align-items: center;
    gap: 3px;
    flex: 1;
    height: 30px;
    min-width: 0;
    transition: opacity 0.3s ease;
  }
  .waveform span {
    display: block;
    width: 3px;
    border-radius: 2px;
    background: rgba(255,255,255,0.25);
    transition: background 0.3s;
    height: 4px;
  }
  body.active .waveform span    { background: rgba(74,222,128,0.30); }
  body.listening .waveform span { background: rgba(74,222,128,0.75); }
  body.thinking .waveform span  { background: rgba(245,158,11,0.5); }
  body.speaking .waveform span  { background: rgba(96,165,250,0.7); }
  body.running .waveform span   { background: rgba(167,139,250,0.4); }
  body.boot .waveform span      { background: rgba(196,181,253,0.9); }
  body.announcing .waveform span { background: rgba(167,139,250,0.75); }
  body.has-transcript .waveform { opacity: 0.25; }

  /* ── Transcript overlay — per-letter reveal ────────────────────────────── */
  .transcript {
    position: absolute;
    left: 38px;
    right: 150px;
    top: 50%;
    transform: translateY(-50%);
    pointer-events: none;
    font-size: 12.5px;
    /* Fixed, so enlarging the spoken word can't grow the line box and shift
       the whole transcript vertically. */
    line-height: 20px;
    font-weight: 500;
    color: rgba(255,255,255,0.95);
    white-space: nowrap;
    overflow: hidden;
    opacity: 0;
    transition: opacity 0.35s ease;
    text-shadow: 0 1px 8px rgba(0,0,0,0.4);
    z-index: 2;
  }
  .transcript.visible { opacity: 1; }
  /* The text rides on its own track so a line longer than the pill can slide
     right-to-left and be read through, instead of being clipped mid-word. */
  .transcript .track {
    display: inline-block;
    white-space: nowrap;
    will-change: transform;
  }
  .transcript .ch {
    display: inline-block;
    opacity: 0;
    transform: translateY(4px) scale(0.9);
    animation: chIn 0.3s var(--smooth) forwards;
  }
  .transcript .ch.sp { width: 0.28em; }
  /* Delegation echo — the exact prompt Vox sent an agent. Violet, because it is
     Vox reporting an action rather than speaking to you. */
  .transcript.deleg { color: #d6c9ff; }
  /* Karaoke: the word being said is white and enlarged, everything else is
     grey at normal size. `scale` is a transform, not a font-size change, so
     the surrounding words never reflow — the line keeps its measured width and
     the follow-the-voice scroll stays exact. */
  .transcript .w {
    display: inline-block;
    transform-origin: 50% 50%;
    transition: color 0.12s ease, transform 0.14s var(--smooth),
                margin 0.14s var(--smooth);
  }
  /* Only dim once a word-by-word pass is actually running: without audio to
     follow (your own transcript) the line stays fully legible. */
  .transcript.karaoke .w { color: rgba(255,255,255,0.42); }
  /* Zoom with `transform`, make room with a per-word margin computed in JS.
     Neither alone works: `font-size` reserves the right space but reflows the
     line VERTICALLY (the whole transcript bobs as the highlight moves), while
     `scale()` leaves the vertical alone but reserves nothing — and its overlap
     is proportional to word length, so no fixed em margin can serve both a
     3-letter and a 10-letter word. So: transform for the look (zero vertical
     effect), and a margin measured from each word's own width for the room.
     See KARAOKE_ZOOM in the script. */
  .transcript.karaoke .w.spoken {
    color: #fff;
    text-shadow: 0 1px 8px rgba(0,0,0,0.5);
  }
  @keyframes chIn { to { opacity: 1; transform: translateY(0) scale(1); } }
  .transcript .caret {
    display: inline-block;
    width: 2px;
    height: 13px;
    margin-left: 3px;
    vertical-align: -2px;
    background: currentColor;
    opacity: 0.7;
    animation: caretBlink 1s steps(2, start) infinite;
  }
  @keyframes caretBlink { 50% { opacity: 0; } }

  /* ── Label ─────────────────────────────────────────────────────────────── */
  .label {
    font-size: 11px;
    letter-spacing: 0.05em;
    color: rgba(255,255,255,0.42);
    flex-shrink: 0;
    min-width: 84px;
    text-align: right;
    transition: color 0.3s;
  }
  body.active .label    { color: rgba(74,222,128,0.6); }
  body.listening .label { color: rgba(74,222,128,0.9); }
  body.thinking .label  { color: rgba(245,158,11,0.7); background: linear-gradient(90deg, rgba(245,158,11,0.5), #ffd188, rgba(245,158,11,0.5)); background-size: 200% 100%; -webkit-background-clip: text; -webkit-text-fill-color: transparent; animation: shimmer 1.6s linear infinite; }
  body.speaking .label  { color: rgba(96,165,250,0.8); }
  body.running .label   { color: rgba(167,139,250,0.9); }
  body.boot .label      { color: rgba(196,181,253,0.95); }
  body.announcing .label { color: rgba(167,139,250,0.95); }
  @keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }

  /* ── Agent badge ───────────────────────────────────────────────────────── */
  .badge {
    display: none;
    background: rgba(167,139,250,0.16);
    border: 1px solid rgba(167,139,250,0.35);
    color: #c3b1fc;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 9px;
    border-radius: 10px;
    letter-spacing: 0.06em;
    flex-shrink: 0;
    animation: badgePop 0.4s var(--spring);
  }
  @keyframes badgePop {
    from { transform: scale(0.5); opacity: 0; }
    to   { transform: scale(1); opacity: 1; }
  }
  /* Outline-only: quieter than the filled agent badge sitting next to it. */
  .badge.announce {
    background: transparent;
    border-color: rgba(167,139,250,0.55);
    color: #c9b8fd;
    min-width: 22px;
    text-align: center;
    padding: 2px 7px;
    cursor: pointer;
  }

  /* ── Gear — revealed on hover with a spin-in ───────────────────────────── */
  .gear {
    width: 0;
    height: 20px;
    padding: 0;
    border: none;
    background: transparent;
    color: rgba(255,255,255,0.5);
    cursor: pointer;
    flex-shrink: 0;
    opacity: 0;
    overflow: hidden;
    transform: rotate(-160deg) scale(0.4);
    transition:
      width 0.35s var(--smooth),
      opacity 0.35s ease,
      transform 0.55s var(--spring),
      color 0.25s ease;
  }
  body.hovered .gear, body.settings-open .gear {
    width: 20px;
    opacity: 1;
    transform: rotate(0deg) scale(1);
  }
  .gear:hover { color: #d9ceff; transform: rotate(50deg) scale(1.12) !important; }
  .gear:active { transform: rotate(120deg) scale(0.95) !important; }
  .gear svg { display: block; width: 20px; height: 20px; }
  body.settings-open .gear { color: #c3b1fc; }

  /* Hover: everything breathes a little wider */
  .bar > * { transition: transform 0.3s var(--smooth); }
  body.hovered .bar { gap: 13px; }

  /* ── Setup panel (first-run auto-install) ───────────────────────────────
     Bottom-anchored like settings; setup wins over settings + carousel. */
  .setup {
    display: none;
    flex-direction: column;
    justify-content: flex-end;
    padding: 16px 22px 4px 22px;
    flex: 1;
    min-height: 0;
    overflow: hidden;
  }
  body.setup-open .setup {
    display: flex;
    animation: settingsIn 0.3s var(--smooth) forwards;
  }
  body.setup-open .settings { display: none; }
  body.setup-open .carousel { display: none; }

  .setup-header {
    display: flex;
    align-items: center;
    justify-content: space-between;

<script>
// ── Tauri bridge ──────────────────────────────────────────────────────────────
const { invoke } = window.__TAURI__.core
const { listen } = window.__TAURI__.event
const { convertFileSrc } = window.__TAURI__.core

// ── VAD config ────────────────────────────────────────────────────────────────
const SPEECH_THRESHOLD   = 0.015
const SILENCE_THRESHOLD  = 0.009
const SILENCE_MS         = 800
const SPEECH_ONSET_MS    = 80
const BARGE_IN_THRESHOLD = 0.030
const MIN_SPEECH_SAMPLES = 8000
const AMBIENT_ALPHA      = 0.002
const SPEECH_SNR         = 2.2

// ── Window geometry (must mirror the Rust animate_frame anchoring) ──────────
// Hover growth is HORIZONTAL ONLY — height never changes on hover.
// One width, always. The hover stretch was the most-noticed motion in the UI
// for the least information: nothing about the pill's meaning changes when the
// cursor arrives. The gear buttons now reveal inside this width.
const SIZE_BASE     = [408, 56]
const SIZE_SETTINGS = [500, 437]  // 6 rows × ~41px + header/padding
const SETTINGS_ROW_H = 41         // 10px padding ×2 + 40px min-height + 1px border
const SIZE_SETUP    = [520, 470]

// ── State machine ─────────────────────────────────────────────────────────────
let state = 'idle'
let agentCount = 0
let agentLabels = []
let pendingAnnouncements = 0
let appearing = false
let returning = false
let settingsOpen = false
let carouselOpen = false
let carouselCloseTimer = null
let hovered = false
let uiLang = 'fr'
let setupOpen = false
let setupRunning = false
let setupInitiated = false

const LABEL_TABLE = {
  fr: {
    idle: '⌥ space', active: 'à l\'écoute', listening: 'je t\'entends…',
    thinking: 'réflexion…', speaking: 'réponse…', running: 'agents actifs',
    boot: 'récap en cours…', announcing: 'annonce…',
    settingsTitle: 'paramètres', model: 'Modèle', lang: 'Langue',
    version: 'Version', update: 'Mises à jour', provider: 'IA',
    provOllama: 'Local (Ollama)', provClaudeCli: 'Claude (abonnement)',
    provCodexCli: 'Codex (abonnement)', provAnthropic: 'Claude (clé API)',
    provOpenai: 'OpenAI (clé API)',
    agentReply: 'Réponse d\'agent', replySummary: 'RÉSUMÉ', replyVerbatim: 'MOT POUR MOT',
    ttsEngine: 'Voix', engAuto: 'Automatique', engKokoro: 'Kokoro', engPiper: 'Piper',
    engQwen: 'Qwen3 (test)', engSay: 'macOS (say)',
    check: 'Vérifier', checking: '…', upToDate: 'À jour', download: 'Télécharger',
    setupTitle: 'installation', setupInstall: 'Installer', setupDone: 'Terminé',
    setupRetry: 'Réessayer', setupStatusBusy: 'installation en cours…',
    setupStatusOk: 'prêt', setupStatusFail: 'échec — réessayez', repair: 'Vérifier',
  },
  en: {
    idle: '⌥ space', active: 'listening', listening: 'I hear you…',
    thinking: 'thinking…', speaking: 'replying…', running: 'agents active',
    boot: 'briefing…', announcing: 'heads up…',
    settingsTitle: 'settings', model: 'Model', lang: 'Language',
    version: 'Version', update: 'Updates', provider: 'AI',
    provOllama: 'Local (Ollama)', provClaudeCli: 'Claude (subscription)',
    provCodexCli: 'Codex (subscription)', provAnthropic: 'Claude (API key)',
    provOpenai: 'OpenAI (API key)',
    agentReply: 'Agent reply', replySummary: 'SUMMARY', replyVerbatim: 'VERBATIM',
    ttsEngine: 'Voice', engAuto: 'Automatic', engKokoro: 'Kokoro', engPiper: 'Piper',
    engQwen: 'Qwen3 (test)', engSay: 'macOS (say)',
    check: 'Check', checking: '…', upToDate: 'Up to date', download: 'Download',
    setupTitle: 'setup', setupInstall: 'Install', setupDone: 'Done',
    setupRetry: 'Retry', setupStatusBusy: 'installing…',
    setupStatusOk: 'ready', setupStatusFail: 'failed — retry', repair: 'Check',
  },
}

const COMP_LABELS = {
  fr: { python: 'Python', ffmpeg: 'ffmpeg', espeakNg: 'espeak-ng', ollama: 'Ollama',
        venv: 'venv', whisper: 'Whisper', kokoro: 'Kokoro', piper: 'Piper',
        piperVoice: 'Voix Piper', qwen3: 'Qwen3-TTS', qwen3Model: 'Modèle Qwen3' },
  en: { python: 'Python', ffmpeg: 'ffmpeg', espeakNg: 'espeak-ng', ollama: 'Ollama',
        venv: 'venv', whisper: 'Whisper', kokoro: 'Kokoro', piper: 'Piper',
        piperVoice: 'Piper voice', qwen3: 'Qwen3-TTS', qwen3Model: 'Qwen3 model' },
}

const labelEl = document.getElementById('label')
let lastLabel = ''

function setLabel(text) {
  if (text === lastLabel) return
  lastLabel = text
  // Crossfade + slide via WAAPI
  labelEl.animate(
    [{ opacity: 1, transform: 'translateY(0)' }, { opacity: 0, transform: 'translateY(-7px)' }],
    { duration: 110, easing: 'ease-in', fill: 'forwards' }
  ).onfinish = () => {
    labelEl.textContent = text
    labelEl.animate(
      [{ opacity: 0, transform: 'translateY(7px)' }, { opacity: 1, transform: 'translateY(0)' }],
      { duration: 200, easing: 'cubic-bezier(0.22, 1, 0.36, 1)', fill: 'forwards' }
    )
  }
}

function bodyClasses() {
  document.body.className = state
    + (setupOpen ? ' setup-open' : '')
    + (settingsOpen ? ' settings-open' : '')
    + (carouselOpen ? ' carousel-open' : '')
    + (hovered ? ' hovered' : '')
    + (transcriptEl.classList.contains('visible') ? ' has-transcript' : '')
    + (appearing ? ' appearing' : '')
    + (returning ? ' returning' : '')
}

// Mirrored to the backend on every transition. The mic lives entirely in the
// webview, so this is Rust's ONLY view of whether Vox may speak unprompted.
// Keep in sync with the UI_* constants in lib.rs.
const UI_CODES = {
  idle: 0, active: 1, listening: 2, thinking: 3,
  speaking: 4, running: 5, boot: 6, announcing: 7,
}

function setState(s) {
  if (s !== state) lastSpeechSignal = Date.now()
  state = s
  invoke('ui_state', { code: UI_CODES[s] ?? 0 }).catch(() => {})
  bodyClasses()
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setLabel(labels[s] || '')
  updateBadge()
  animateWaveform(s)
}

function updateBadge() {
  const badge = document.getElementById('badge')
  // Naming the single agent is the high-value case: you launched it three
  // seconds ago and want to confirm it went to the right repo. With two or
  // more the labels won't fit a 480px pill, so fall back to the count.
  // Repo name only: "orivo (porto)" is wider than the gutter the transcript
  // reserves on the right, and the two collided mid-sentence. The worktree
  // codename is still in the tooltip.
  const short = (agentLabels[0] || '').split(' (')[0]
  badge.textContent = (agentCount === 1 && short)
    ? '1 · ' + short
    : agentCount + (agentCount === 1 ? ' agent' : ' agents')
  badge.title = agentLabels.join(', ')
  badge.style.display = (agentCount > 0 && state !== 'idle') ? 'block' : 'none'
  updateAnnounceBadge()
}

function updateAnnounceBadge() {
  const b = document.getElementById('announce-badge')
  b.textContent = pendingAnnouncements
  b.title = pendingAnnouncements
    ? (uiLang === 'en' ? 'Click to hear what\'s waiting' : 'Clique pour entendre ce qui attend')
    : ''
  // Hidden while actually announcing — the pill itself is the signal then.
  b.style.display = (pendingAnnouncements > 0 && state !== 'announcing') ? 'block' : 'none'
}

// ── Waveform ──────────────────────────────────────────────────────────────────
const waveEl = document.getElementById('waveform')
const BAR_COUNT = 18
for (let i = 0; i < BAR_COUNT; i++) waveEl.appendChild(document.createElement('span'))
const bars = waveEl.querySelectorAll('span')

let rafId
function animateWaveform(s) {
  cancelAnimationFrame(rafId)

  function tick() {
    const t = Date.now()
    bars.forEach((b, i) => {
      let h = 4
      if (s === 'idle') {
        // Gentle breathing so the bar always feels alive
        h = 3 + Math.abs(Math.sin(t / 2400 + i * 0.4)) * 2.5
      } else if (s === 'active') {
        h = 4 + Math.abs(Math.sin(t / 1600 + i * 0.32)) * 4
      } else if (s === 'listening') {
        h = 6 + Math.abs(Math.sin(t / 105 + i * 0.75)) * 23
      } else if (s === 'thinking') {
        const phase = (t / 260 + i * 0.5) % (BAR_COUNT * 0.5)
        h = 4 + Math.max(0, 21 - Math.abs(phase - BAR_COUNT * 0.25) * 3)
      } else if (s === 'speaking') {
        h = 5 + Math.abs(Math.sin(t / 92 + i * 0.9)) * 19
      } else if (s === 'running') {
        h = i % 4 === 0 ? 4 + Math.abs(Math.sin(t / 550 + i)) * 9 : 4
      } else if (s === 'announcing') {
        // Travelling wave, L→R: something arrived from outside, as opposed to
        // boot's centre-out "waking up" or speaking's conversational bounce.
        const phase = (t / 150 - i * 0.55) % 7
        h = 5 + Math.max(0, 17 - Math.abs(phase - 1.5) * 9)
      } else if (s === 'boot') {
        // Center-out ripple — the "AI arriving" wave
        const center = (BAR_COUNT - 1) / 2
        const dist = Math.abs(i - center)
        const wave = Math.sin(t / 115 - dist * 0.55)
        h = 6 + Math.max(0, wave) * Math.max(4, 22 - dist * 1.5)
      }
      b.style.height = h.toFixed(1) + 'px'
    })
    rafId = requestAnimationFrame(tick)
  }
  rafId = requestAnimationFrame(tick)
}

// ── Transcript reveal ─────────────────────────────────────────────────────────
const transcriptEl = document.getElementById('transcript')
let transcriptHideTimer = null
let transcriptScrollTimer = null

function showTranscript(text, holdMs = 8000, { deleg = false } = {}) {
  clearTimeout(transcriptHideTimer)
  transcriptHideTimer = null
  stopKaraoke()
  transcriptEl.classList.toggle('deleg', deleg)
  transcriptEl.innerHTML = ''

  // Words wrap the per-letter spans so a word can be highlighted as a unit
  // while the reveal still animates character by character.
  const track = document.createElement('span')
  track.className = 'track'
  const words = []
  let charIndex = 0
  const perChar = Math.max(13, Math.min(34, 900 / Math.max(text.length, 1)))

  // Split keeping the separators, so spacing survives the round trip.
  for (const piece of text.split(/(\s+)/)) {
    if (!piece) continue
    const isSpace = /^\s+$/.test(piece)
    const wordEl = document.createElement('span')
    wordEl.className = isSpace ? 'w sp-w' : 'w'
    for (const ch of piece) {
      const span = document.createElement('span')
      span.className = 'ch' + (ch === ' ' ? ' sp' : '')
      span.textContent = ch === ' ' ? ' ' : ch
      span.style.animationDelay = (charIndex * perChar) + 'ms'
      wordEl.appendChild(span)
      charIndex++
    }
    if (!isSpace) {
      words.push({ el: wordEl, start: charIndex - piece.length, end: charIndex })
    }
    track.appendChild(wordEl)
  }

  const caret = document.createElement('span')
  caret.className = 'caret'
  track.appendChild(caret)
  transcriptEl.appendChild(track)
  transcriptEl.classList.add('visible')
  bodyClasses()

  // One forced layout per sentence: measure every word at rest, then never
  // read layout again while the highlight moves.
  for (const w of words) w.pad = Math.round(w.el.offsetWidth * (KARAOKE_ZOOM - 1) / 2)

  karaoke = { track, words, total: charIndex, overflow: 0, active: -1 }
  karaoke.overflow = Math.max(0, track.scrollWidth - transcriptEl.clientWidth)

  // Fallback when there's no audio to follow (the user's own transcript, or a
  // `say` fallback): time-based scroll so a long line still reads through.
  clearTimeout(transcriptScrollTimer)
  const revealMs = charIndex * perChar + 300
  let scrollMs = 0
  if (karaoke.overflow > 4) {
    scrollMs = Math.round((karaoke.overflow / 70) * 1000) + 1500
    transcriptScrollTimer = setTimeout(() => {
      // Karaoke took over in the meantime — leave it alone.
      if (karaoke && karaoke.driven) return
      track.style.transition = 'transform ' + (scrollMs - 1500) + 'ms linear'
      track.style.transform = 'translateX(-' + karaoke.overflow + 'px)'
    }, revealMs + 600)
  }

  // holdMs = 0 → no auto-hide (live speech: the next sentence or the
  // speaking-done handler decides). Otherwise never hide mid-scroll.
  if (holdMs > 0) {
    transcriptHideTimer = setTimeout(hideTranscript, Math.max(holdMs, revealMs + scrollMs))
  }
}

// ── Karaoke ───────────────────────────────────────────────────────────────────
// Highlight follows the AUDIO, not a guessed reading speed: progress through
// the WAV maps to progress through the sentence. It's linear rather than
// phoneme-aligned — the daemons return a WAV, not word timings — but over one
// short sentence at a steady speaking rate it tracks closely, and it can never
// drift out of sync with the voice the way a fixed px/s scroll does.
const KARAOKE_ZOOM = 1.2
let karaoke = null
let karaokeRaf = 0

function stopKaraoke() {
  if (karaokeRaf) cancelAnimationFrame(karaokeRaf)
  karaokeRaf = 0
  karaoke = null
  transcriptEl.classList.remove('karaoke')
}

function driveKaraoke(audio) {
  if (!karaoke || !karaoke.words.length) return
  karaoke.driven = true
  transcriptEl.classList.add('karaoke')
  // Drop the timed scroll: the audio drives position from here on.
  karaoke.track.style.transition = 'transform 0.18s linear'

  const step = () => {
    if (!karaoke || !audio || audio.paused || audio.ended) {
      karaokeRaf = 0
      return
    }
    const dur = audio.duration
    if (dur && isFinite(dur) && dur > 0) {
      const p = Math.min(1, audio.currentTime / dur)
      const at = p * karaoke.total
      let idx = karaoke.words.findIndex((w) => at < w.end)
      if (idx < 0) idx = karaoke.words.length - 1

      if (idx !== karaoke.active) {
        const prev = karaoke.active
        karaoke.active = idx
        // Only touch the two words that changed — repainting all of them every
        // step is what makes a karaoke line shimmer.
        for (const i of [prev, idx]) {
          const w = karaoke.words[i]
          if (!w) continue
          const on = i === idx
          w.el.classList.toggle('spoken', on)
          w.el.style.transform = on ? 'scale(' + KARAOKE_ZOOM + ')' : ''
          // Exactly the width the zoom will claim on each side — measured from
          // this word, so a long word gets more room than a short one.
          w.el.style.margin = on ? '0 ' + w.pad + 'px' : ''
        }
        // Keep the spoken word in view, a third in from the left so the next
        // few words are already readable.
        if (karaoke.overflow > 4) {
          const target = karaoke.words[idx].el.offsetLeft - transcriptEl.clientWidth * 0.33
          const x = Math.max(0, Math.min(karaoke.overflow, target))
          karaoke.track.style.transform = 'translateX(-' + x + 'px)'
        }
      }
    }
    karaokeRaf = requestAnimationFrame(step)
  }
  if (!karaokeRaf) karaokeRaf = requestAnimationFrame(step)
}

function hideTranscript() {
  transcriptEl.classList.remove('visible')
  stopKaraoke()
  clearTimeout(transcriptScrollTimer)
  clearTimeout(transcriptHideTimer)
  transcriptHideTimer = null
  voxIsShowing = false
  bodyClasses()
}

// ── VAD core ──────────────────────────────────────────────────────────────────
let audioCtx = null, analyser = null, processor = null, micStream = null
let pcmChunks = [], isRecording = false, currentAudio = null
let ttsStartedAt = null, silenceTimer = null, rafVAD = null, speechOnsetAt = null
let ambientRMS = SPEECH_THRESHOLD * 0.5

async function activateVox() {
  if (micStream) return
  try {
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true },
    })
    if (!audioCtx || audioCtx.state === 'closed') {
      audioCtx = new AudioContext({ sampleRate: 16000 })
    } else if (audioCtx.state === 'suspended') {
      await audioCtx.resume()
    }
    const source = audioCtx.createMediaStreamSource(micStream)
    analyser = audioCtx.createAnalyser()
    analyser.fftSize = 512
    source.connect(analyser)
    processor = audioCtx.createScriptProcessor(2048, 1, 1)
    processor.onaudioprocess = (e) => {
      if (isRecording && !currentAudio) {
        pcmChunks.push(new Float32Array(e.inputBuffer.getChannelData(0)))
      }
    }
    source.connect(processor)
    processor.connect(audioCtx.destination)
    setState('active')
    vadTick()
  } catch (err) {
    console.error('[vox] activateVox failed:', err.message)
  }
}

function deactivateVox() {
  cancelAnimationFrame(rafVAD)
  clearTimeout(silenceTimer)
  silenceTimer = null
  isRecording = false
  currentAudio = null
  pcmChunks = []
  speechOnsetAt = null
  processor?.disconnect()
  analyser?.disconnect()
  processor = null
  analyser = null
  micStream?.getTracks().forEach(t => t.stop())
  micStream = null
  audioCtx?.suspend()
  setState(agentCount > 0 ? 'running' : 'idle')
}

function getRMS() {
  const buf = new Float32Array(analyser.fftSize)
  analyser.getFloatTimeDomainData(buf)
  let sum = 0; for (const s of buf) sum += s * s
  return Math.sqrt(sum / buf.length)
}

function vadTick() {
  if (!analyser) return
  const rms = getRMS()

  if (currentAudio) {
    // Barge-in only while Vox is answering YOU. During an unprompted
    // announcement you never opened the mic, so a level above the threshold is
    // Vox hearing itself through the speakers — and the durable queue then
    // faithfully re-speaks what it thinks you cut off. That is where the
    // intermittent duplicate announcements came from. ⌥Space still stops one.
    if (state !== 'announcing'
        && rms > BARGE_IN_THRESHOLD && ttsStartedAt && Date.now() - ttsStartedAt > 1200) {
      currentAudio.pause()
      currentAudio = null
      isRecording = false
      pcmChunks = []
      clearTimeout(silenceTimer); silenceTimer = null
      // interrupt (not audio_done): aborts the WHOLE queued session, not
      // just the current sentence — otherwise the next sentence plays on.
      invoke('interrupt')
      setState('active')
    }
  } else if (state === 'active' || state === 'running') {
    if (!isRecording) {
      const triggerThreshold = Math.max(SPEECH_THRESHOLD, ambientRMS * SPEECH_SNR)
      if (rms > triggerThreshold) {
        if (!speechOnsetAt) speechOnsetAt = Date.now()
        else if (Date.now() - speechOnsetAt > SPEECH_ONSET_MS) {
          isRecording = true
          pcmChunks = []
          speechOnsetAt = null
          clearTimeout(silenceTimer); silenceTimer = null
          hideTranscript()
          setState('listening')
        }
      } else {
        speechOnsetAt = null
        ambientRMS = ambientRMS * (1 - AMBIENT_ALPHA) + rms * AMBIENT_ALPHA
      }
    }
  } else if (state === 'listening') {
    if (rms < SILENCE_THRESHOLD) {
      if (!silenceTimer) silenceTimer = setTimeout(sendSpeech, SILENCE_MS)
    } else {
      clearTimeout(silenceTimer); silenceTimer = null
    }
  }

  rafVAD = requestAnimationFrame(vadTick)
}

function sendSpeech() {
  clearTimeout(silenceTimer); silenceTimer = null
  if (!isRecording) return
  isRecording = false

  const totalSamples = pcmChunks.reduce((n, c) => n + c.length, 0)
  const sampleRate = audioCtx?.sampleRate || 16000

  if (totalSamples < MIN_SPEECH_SAMPLES) {
    pcmChunks = []
    setState(micStream ? 'active' : 'idle')
    return
  }

  setState('thinking')
  const merged = new Float32Array(totalSamples)
  let off = 0; for (const c of pcmChunks) { merged.set(c, off); off += c.length }
  pcmChunks = []

  invoke('voice_input', { wav: abToB64(encodeWAV(merged, sampleRate)) })
}

function abToB64(buf) {
  const u8 = new Uint8Array(buf)
  let s = ''
  const CH = 0x8000
  for (let i = 0; i < u8.length; i += CH) {
    s += String.fromCharCode.apply(null, u8.subarray(i, i + CH))
  }
  return btoa(s)
}

function encodeWAV(samples, sampleRate) {
  const buf = new ArrayBuffer(44 + samples.length * 2)
  const v = new DataView(buf)
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)) }
  str(0, 'RIFF'); v.setUint32(4, 36 + samples.length * 2, true)
  str(8, 'WAVE'); str(12, 'fmt ')
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true)
  v.setUint32(24, sampleRate, true); v.setUint32(28, sampleRate * 2, true)
  v.setUint16(32, 2, true); v.setUint16(34, 16, true)
  str(36, 'data'); v.setUint32(40, samples.length * 2, true)
  for (let i = 0; i < samples.length; i++) {
    const s = Math.max(-1, Math.min(1, samples[i]))
    v.setInt16(44 + i * 2, s < 0 ? s * 0x8000 : s * 0x7FFF, true)
  }
  return buf
}

function interruptSpeech() {
  if (currentAudio) {
    try { currentAudio.pause() } catch {}
    currentAudio = null
  }
  invoke('interrupt')  // stops in-flight playback + aborts a pending brief
  closeCarousel(0)     // don't leave the recap cards hanging on screen
  setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
}

async function toggleVox() {
  // During first-run setup the pill only shows install progress.
  if (setupOpen) return
  // ⌥Space stops the startup recap (boot), a reply being spoken (speaking), or
  // an unprompted announcement. 'thinking' stays a no-op: interrupting an
  // in-flight LLM call and letting a new turn start would race the abandoned
  // reply onto the voice.
  // An interrupted announcement is NOT lost — the backend queue is durable and
  // puts it back at the front, so it returns once you're quiet again.
  if (state === 'boot' || state === 'speaking' || state === 'announcing') {
    interruptSpeech()
    return
  }
  if (state === 'idle' || state === 'running') {
    await activateVox()
  } else if (state !== 'thinking') {
    deactivateVox()
  }
}

let hoverOutTimer = null
let userDragging = false

// ── Dragging the pill ─────────────────────────────────────────────────────────
// Done here rather than by AppKit: the window is a non-activating NSPanel (so it
// can appear over other apps' fullscreen Spaces), and such a panel never becomes
// key on click, so AppKit's movableByWindowBackground drag loop never starts.
//
// Pointer capture is what makes this reliable — events keep arriving even when
// the cursor outruns the window, which a plain mousemove listener would lose.
// Deltas are accumulated and flushed once per frame so a fast drag doesn't
// queue hundreds of IPC calls.
let dragState = null
let dragRaf = 0

function flushDrag() {
  dragRaf = 0
  if (!dragState || (!dragState.dx && !dragState.dy)) return
  const { dx, dy } = dragState
  dragState.dx = 0
  dragState.dy = 0
  invoke('move_pill', { dx, dy }).catch(() => {})
}

document.addEventListener('pointerdown', (e) => {
  if (e.button !== 0) return
  // Never hijack a real control.
  if (e.target?.closest?.('button, select, input, .ws-card, .setup-chip')) return
  if (!e.target?.closest?.('[data-tauri-drag-region]')) return
  dragState = { x: e.screenX, y: e.screenY, dx: 0, dy: 0, moved: 0, id: e.pointerId }
  userDragging = true
  try { e.target.setPointerCapture(e.pointerId) } catch {}
})

document.addEventListener('pointermove', (e) => {
  if (!dragState || e.pointerId !== dragState.id) return
  dragState.moved += Math.abs(e.screenX - dragState.x) + Math.abs(e.screenY - dragState.y)
  dragState.dx += e.screenX - dragState.x
  dragState.dy += e.screenY - dragState.y
  dragState.x = e.screenX
  dragState.y = e.screenY
  if (!dragRaf) dragRaf = requestAnimationFrame(flushDrag)
})

function endDrag(e) {
  if (!dragState) return
  flushDrag()
  const moved = dragState.moved
  try { e?.target?.releasePointerCapture?.(dragState.id) } catch {}
  dragState = null
  userDragging = false
  // A press that didn't travel is a click, not a drag: that's the gesture for
  // showing the worktree list.
  if (moved < 4) toggleCarousel()
}
document.addEventListener('pointerup', endDrag)
document.addEventListener('pointercancel', endDrag)

document.body.addEventListener('mouseenter', () => {
  userDragging = false  // native drag swallows mouseup — reset here
  clearTimeout(hoverOutTimer)
  if (hovered) return
  hovered = true
  bodyClasses()
  if (!settingsOpen) syncWindow()
})
document.body.addEventListener('mouseleave', () => {
  if (userDragging) return
  // Small grace period so edge-crossing doesn't flicker
  clearTimeout(hoverOutTimer)
  hoverOutTimer = setTimeout(() => {
    hovered = false
    bodyClasses()
    if (!settingsOpen) syncWindow()
  }, 140)
})

function renderSetup(probe) {
  const labels = COMP_LABELS[uiLang] || COMP_LABELS.fr
  setupGrid.innerHTML = ''
  const comps = (probe && probe.components) || {}
  for (const key of Object.keys(COMP_LABELS.fr)) {

    const chip = document.createElement('div')
    chip.className = 'setup-chip ' + (c.ok ? 'ok' : 'miss')
      + (OPTIONAL_COMPONENTS.has(key) ? ' opt' : '')

    name.textContent = labels[key]

    detail.title = c.detail || ''

  }
}

function appendLog(tag, line) {
  const row = document.createElement('div')
  const t = document.createElement('span')
  t.className = 'ln-tag'
  t.textContent = tag
  row.append(t, document.createTextNode(line))
  setupLog.appendChild(row)
  setupLog.scrollTop = setupLog.scrollHeight
}

  setupStatus.className = 'setup-status' + (cls ? ' ' + cls : '')

  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  document.getElementById('setup-title').textContent = labels.setupTitle

  if (!setupRunning) setSetupBtn(labels.setupInstall, false)
  renderSetup(lastProbe)
}
let lastProbe = null

function openSetup() {
  if (settingsOpen) {
    settingsOpen = false
  }
  carouselOpen = false
  setupOpen = true
  bodyClasses()
  syncWindow()
}

function closeSetup() {
  if (!setupOpen) return
  setupOpen = false
  bodyClasses()
  syncWindow()

async function startSetup() {
  if (setupRunning) return
  setupRunning = true
  const labels = LABEL_TABLE[uiLang] || LABEL_TABLE.fr
  setSetupBtn(labels.setupInstall, true)
  setSetupStatus('busy', labels.setupStatusBusy)
  setupLog.innerHTML = ''
  try {
    const probe = await invoke('run_setup')
    setupRunning = false
    lastProbe = probe
    renderSetup(probe)
    if (!probe.needsSetup) {
      setSetupStatus('ok', labels.setupStatusOk)
      setSetupBtn(labels.setupDone, false)
      setTimeout(closeSetup, 2200)
    } else {
      setSetupStatus('bad', labels.setupStatusFail)
      setSetupBtn(labels.setupRetry, false)
    }
  } catch (err) {
    setupRunning = false
    appendLog('setup', String(err.message || err))
    setSetupStatus('bad', labels.setupStatusFail)
    setSetupBtn(labels.setupRetry, false)
  }
}

function maybeAutoSetup(probe) {
  if (setupInitiated || !probe || !probe.needsSetup) return
  setupInitiated = true
  openSetup()
  renderSetup(probe)
  startSetup()
}

})

// ── Events from Rust ─────────────────────────────────────────────────────────
// Restarting a CSS animation needs the class off, a forced reflow, then on —
// otherwise re-adding it is a no-op and nothing plays.
function replay(setFlag, ms) {
  setFlag(false)
  bodyClasses()
  void document.body.offsetWidth
  setFlag(true)
  bodyClasses()
  return setTimeout(() => { setFlag(false); bodyClasses() }, ms)
}

let appearTimer = null
let returnTimer = null

// First show only: Rust keeps the window hidden for 400ms, so this genuinely
// starts from nothing and can afford to fade and rise.
function playEntrance() {
  clearTimeout(appearTimer)
  appearTimer = replay((v) => { appearing = v }, 500)
}

// Back from another Space. We find out AFTER the compositor has drawn the pill,
// so this must never start from invisible.
function playReturn() {
  clearTimeout(returnTimer)
  returnTimer = replay((v) => { returning = v }, 620)
}
listen('pill-appear', playReturn)
listen('pill-shown', playEntrance)

listen('toggle-listening', toggleVox)
listen('toggle-settings', toggleSettings)

listen('setup-needed', (e) => {
  lastProbe = e.payload
  maybeAutoSetup(e.payload)
})

listen('setup-log', (e) => {
  appendLog(e.payload.tag || 'setup', e.payload.line || '')
})

// Last-resort unbricking. The pill only leaves a speaking state on
// speaking-done, so ANY backend path that fails to emit it would strand the UI
// until restart. This makes that impossible regardless of backend bugs.
let lastSpeechSignal = Date.now()
const SPEECH_STALL_MS = 150000
setInterval(() => {
  const stuck = state === 'thinking' || state === 'boot'
             || state === 'speaking' || state === 'announcing'
  if (stuck && Date.now() - lastSpeechSignal > SPEECH_STALL_MS) {
    console.warn('[vox] speech state stalled — force-settling')
    currentAudio = null
    setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
  }
}, 5000)

listen('speaking-start', () => {
  lastSpeechSignal = Date.now()
  ttsStartedAt = Date.now()
  setState('speaking')
})

listen('speaking-done', () => {
  currentAudio = null
  // Settle from any TTS/pending state. 'thinking' MUST be included: error
  // paths (Ollama down, empty transcript, empty tool text) emit speaking-done
  // without ever emitting speaking-start, and 'thinking' has no other exit —
  // excluding it bricked the pill until restart. 'active'/'listening' stay
  // protected from late duplicate speaking-done events.
  if (state === 'speaking' || state === 'boot' || state === 'thinking' || state === 'announcing') {
    setState(micStream ? 'active' : (agentCount > 0 ? 'running' : 'idle'))
  }
  if (carouselOpen) closeCarousel(1400)
  if (transcriptEl.classList.contains('visible')) {
    clearTimeout(transcriptHideTimer)
    // Clear out promptly once the voice stops. Leaving the last sentence up for
    // 45s meant the pill spent most of its life displaying something already
    // said — the bar should return to rest when Vox is done.
    transcriptHideTimer = setTimeout(hideTranscript, voxIsShowing ? 2200 : 1300)
  }
})

// TTS audio: played here so echo cancellation enables barge-in. Payload is
// one queued sentence: { path, workspace?, id } — the workspace tag drives
// the carousel, the id makes the done-ack idempotent (a failed load fires
// both onerror AND play().catch; a duplicate ack must not consume the NEXT
// sentence's wait on the Rust side).
listen('play-wav', (e) => {
  lastSpeechSignal = Date.now()
  const src = convertFileSrc(e.payload.path)
  const id = e.payload.id
  if (e.payload.workspace) {
    // Sessions serialize on the Rust side, so the recap may start speaking
    // after another reply's speaking-done already closed the carousel —
    // reopen it lazily whenever a workspace-tagged sentence plays.
    if (!carouselOpen && !settingsOpen && carouselEl.children.length > 0) openCarousel()
    highlightWorkspace(e.payload.workspace)
  }
  let acked = false
  const finish = () => {
    if (acked) return
    acked = true
    currentAudio = null
    invoke('audio_done', { id })
  }
  currentAudio = new Audio(src)
  currentAudio.onended = finish
  currentAudio.onerror = finish
  // Highlight + scroll follow this clip's playback position.
  currentAudio.onplaying = () => driveKaraoke(currentAudio)
  currentAudio.play().then(() => driveKaraoke(currentAudio)).catch(finish)
})

// Worktree cards for the recap carousel — arrives just before the brief.
// Only auto-open from a resting/boot state; never yank the UI open while the
// user is mid-recording or mid-reply (play-wav reopens it lazily anyway).
listen('workspaces-data', (e) => {
  // Build only. The watcher refreshes this every 30s, so auto-opening here kept
  // the worktree list permanently on screen with no way to dismiss it. It opens
  // for the startup recap (which is about those cards) and otherwise when you
  // click the pill.
  buildCarousel(Array.isArray(e.payload) ? e.payload : [])
  if (state === 'boot') openCarousel()
})

listen('agent-status', (e) => {
  agentCount = e.payload.count
  agentLabels = (e.payload.agents || []).map((a) => a.label).filter(Boolean)
  if (state !== 'listening' && state !== 'thinking' && state !== 'speaking'
      && state !== 'active' && state !== 'boot' && state !== 'announcing') {
    setState(agentCount > 0 ? 'running' : 'idle')
  } else {
    updateBadge()
  }
})

// ── Proactive announcements ───────────────────────────────────────────────
// Two invariants keep this from feeling like Clippy:
//  1. it NEVER steals the turn — the backend only speaks from a resting state,
//     and this guard mirrors that so a late event can't override a live turn;
//  2. it is interruptible on the first syllable — ⌥Space (toggleVox) and the
//     VAD barge-in path both already work, since currentAudio is set.
listen('announce-start', () => {
  // The count itself is owned by the backend (announce-pending) — it emits the
  // post-pop value just before this fires, so don't decrement here too.
  if (state === 'idle' || state === 'active' || state === 'running') {
    setState('announcing')
  } else {
    updateAnnounceBadge()
  }
})

listen('announce-pending', (e) => {
  pendingAnnouncements = e.payload.count || 0
  updateAnnounceBadge()
})

listen('announce-done', () => { updateAnnounceBadge() })

document.getElementById('announce-badge').addEventListener('click', () => {
  if (pendingAnnouncements === 0) return
  if (state === 'idle' || state === 'active' || state === 'running') {
    invoke('speak_pending_announcements')
  }
})

// The exact prompt sent to an agent. Vox says one short sentence out loud, so
// this is the only place the full drafted prompt is ever visible — and Conductor
// cannot show it either, since a headless agent writes nothing to its database.
listen('delegation', (e) => {
  const p = e.payload || {}
  const prompt = (p.prompt || '').trim()
  if (!prompt) return
  voxIsShowing = false
  showTranscript('→ ' + (p.project || '?') + ' — ' + prompt, 14000, { deleg: true })
  if (p.project) highlightWorkspace(p.project)
})

listen('transcript', (e) => {
  if (e.payload && e.payload.trim()) {
    voxIsShowing = false
    showTranscript(e.payload.trim())
  }
})

// Live transcript of Vox's own speech, one sentence at a time. The last
// sentence sticks around after speaking-done (that's usually the advice).
let voxIsShowing = false
listen('speaking-text', (e) => {
  const t = (e.payload.text || '').trim()
  if (!t) return
  voxIsShowing = true
  showTranscript(t, 0)
})

listen('startup-brief-starting', () => {
  // Mid-utterance: finish the recording first (the recap will queue behind
  // the reply on the Rust side). Flipping to 'boot' here would strand
  // isRecording forever — vadTick has no 'boot' branch.
  if (state === 'listening') {
    sendSpeech()
    return
  }
  if (state === 'idle' || state === 'active' || state === 'running') {
    setState('boot')
  }
})

// ── Init ──────────────────────────────────────────────────────────────────────
;(async () => {
  try {
    const s = await invoke('get_settings')
    uiLang = s.language || 'fr'
  } catch {}
  applyUiLang()
  setState('idle')

  // First-run setup: if the speech stack is incomplete, open the panel and
  // auto-install. Daemons stay down until run_setup completes (Rust restarts
  // them and emits no startup brief before then).
  try {
    const probe = await invoke('probe_setup')
    lastProbe = probe
    maybeAutoSetup(probe)
  } catch {}
})()

console.log('[vox renderer] ready — ⌥Space to talk, ⌘, or gear for settings')
</script>
</body>
</html>
