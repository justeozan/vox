name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

# Signing and notarisation (repository secrets and variables, required: a release that
# Gatekeeper blocks is worse than no release):
#   secrets.MACOS_CERTIFICATE (Developer ID .p12, base64), secrets.MACOS_CERTIFICATE_PASSWORD,
#   vars.MACOS_SIGN_IDENTITY, secrets.NOTARY_KEY (App Store Connect .p8 contents),
#   secrets.NOTARY_KEY_ID, secrets.NOTARY_ISSUER.
# Optional, publishes the .dmg to evey.run/download/vox:
#   secrets.R2_ACCESS_KEY_ID, secrets.R2_SECRET_ACCESS_KEY, secrets.CLOUDFLARE_ACCOUNT_ID,
#   vars.R2_BUCKET.
jobs:
  build-release:
    runs-on: macos-latest
    env:
      # Read by `tauri build`: it imports the certificate into a temporary keychain, signs the
      # app (hardened runtime, src-tauri/Entitlements.plist) and the .dmg, then notarises and
      # staples the app. APPLE_SIGNING_IDENTITY overrides the ad hoc "-" of tauri.conf.json.
      APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ vars.MACOS_SIGN_IDENTITY }}
      APPLE_API_KEY: ${{ secrets.NOTARY_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      HAS_R2: ${{ secrets.R2_ACCESS_KEY_ID != '' && vars.R2_BUCKET != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Write the notary key
        env:
          NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
        run: |
          for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_API_KEY APPLE_API_ISSUER NOTARY_KEY; do
            [ -n "${!v}" ] || { echo "::error::${v} is not set: see the secrets listed at the top of this workflow."; exit 1; }
          done
          key="${RUNNER_TEMP}/AuthKey_${APPLE_API_KEY}.p8"
          printf '%s\n' "${NOTARY_KEY}" > "${key}"
          echo "APPLE_API_KEY_PATH=${key}" >> "${GITHUB_ENV}"

      - name: Build Vox (app + dmg)
        # --features licence: official binaries enforce the Evey licence (see README).
        run: npm run tauri build -- --bundles app,dmg --features licence

      # Tauri notarises the app inside; notarising the .dmg too lets Gatekeeper accept the
      # download itself, offline included.
      - name: Notarise and staple the dmg
        run: |
          dmg="$(ls src-tauri/target/release/bundle/dmg/*.dmg)"
          xcrun notarytool submit "${dmg}" --key "${APPLE_API_KEY_PATH}" --key-id "${APPLE_API_KEY}" \
            --issuer "${APPLE_API_ISSUER}" --wait --timeout 30m
          xcrun stapler staple "${dmg}"
          spctl --assess --type open --context context:primary-signature --verbose "${dmg}"
          spctl --assess --type execute --verbose src-tauri/target/release/bundle/macos/Vox.app

      - name: Zip the .app bundle
        run: |
          cd src-tauri/target/release/bundle/macos
          ditto -c -k --sequesterRsrc --keepParent Vox.app Vox.app.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/macos/Vox.app.zip

      # Through R2's S3 API (curl signs the request), like Orb's release workflow. The site
      # serves vox/<latest.txt> at evey.run/download/vox.
      - name: Publish to R2 (when configured)
        if: env.HAS_R2 == 'true'
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BUCKET: ${{ vars.R2_BUCKET }}
        run: |
          version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          name="Vox-${version}.dmg"
          put() {
            curl --fail-with-body --silent --show-error --retry 3 --aws-sigv4 "aws:amz:auto:s3" \
              --user "${R2_ACCESS_KEY_ID}:${R2_SECRET_ACCESS_KEY}" -H "Content-Type: $3" -T "$2" \
              "https://${ACCOUNT_ID}.r2.cloudflarestorage.com/${BUCKET}/vox/$1"
          }
          put "${name}" "$(ls src-tauri/target/release/bundle/dmg/*.dmg)" application/x-apple-diskimage
          printf '%s\n' "${name}" > "${RUNNER_TEMP}/latest.txt"
          put latest.txt "${RUNNER_TEMP}/latest.txt" text/plain
